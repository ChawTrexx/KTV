<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeChat Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui;
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#fff;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
header{
  padding:12px;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#callBtn{
  background:#22c55e;
  border:none;
  padding:8px 14px;
  border-radius:20px;
  color:#fff;
  font-weight:bold;
}

/* CHAT */
#messages{
  flex:1;
  overflow:auto;
  padding:10px;
}

.msg{
  max-width:75%;
  padding:10px;
  margin:6px;
  border-radius:12px;
  background:#1e293b;
}

.me{
  margin-left:auto;
  background:#2563eb;
}

/* INPUT */
footer{
  display:flex;
  padding:10px;
  background:#020617;
}

#msgInput{
  flex:1;
  padding:12px;
  border:none;
  border-radius:25px;
  background:#1e293b;
  color:#fff;
}

#sendBtn{
  margin-left:10px;
  border:none;
  border-radius:50%;
  padding:12px;
  background:#3b82f6;
  color:#fff;
}

/* CALL SCREEN */
#callScreen{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
}

#callName{font-size:22px}
#callStatus{color:#aaa;margin-top:5px}

.callBtns{
  position:absolute;
  bottom:50px;
  display:flex;
  gap:20px;
}

.callBtns button{
  width:65px;height:65px;
  border-radius:50%;
  border:none;
  font-size:20px;
}

#endCall{background:#ef4444;color:#fff}
#mute{background:#374151;color:#fff}

/* INCOMING */
#incoming{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:1000;
}

#incoming button{
  margin:10px;
  padding:12px 25px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

#accept{background:#22c55e;color:#fff}
#reject{background:#ef4444;color:#fff}
</style>
</head>

<body>

<header>
  <h3 id="userName">🔥 WeChat</h3>
  <button id="callBtn">📞 Call</button>
</header>

<div id="messages"></div>

<footer>
  <input id="msgInput" placeholder="Type message...">
  <button id="sendBtn">➤</button>
</footer>

<!-- CALL -->
<div id="callScreen">
  <div id="callName">Calling...</div>
  <div id="callStatus">Connecting...</div>

  <div class="callBtns">
    <button id="mute">🔇</button>
    <button id="endCall">❌</button>
  </div>
</div>

<!-- INCOMING -->
<div id="incoming">
  <h2>📞 Incoming Call</h2>
  <button id="accept">Accept</button>
  <button id="reject">Reject</button>
</div>

<audio id="remoteAudio" autoplay></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, push, set, onChildAdded, remove, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

/* 🔥 YOUR NEW FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyC8mmwZ_H-jTPNfZsTXIymIuD_wHN0KaXk",
  authDomain: "wechat-34e85.firebaseapp.com",
  databaseURL: "https://wechat-34e85-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "wechat-34e85",
  storageBucket: "wechat-34e85.firebasestorage.app",
  messagingSenderId: "935799721802",
  appId: "1:935799721802:web:a151f180fc96c15ef9bbb3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* USER */
let username = localStorage.getItem("u") || prompt("Enter name");
localStorage.setItem("u", username);
userName.innerText = username;

/* CHAT */
const chatRef = ref(db,"chat");

sendBtn.onclick = ()=>{
  if(!msgInput.value) return;
  push(chatRef,{user:username,text:msgInput.value});
  msgInput.value="";
};

onChildAdded(chatRef,s=>{
  let d=s.val();
  let div=document.createElement("div");
  div.className="msg "+(d.user===username?"me":"");
  div.innerText=d.user+": "+d.text;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
});

/* CALL */
let pc,localStream;
const uid=Math.random().toString(36).slice(2);
const callRef=ref(db,"call");

callBtn.onclick=startCall;

async function startCall(){
  callScreen.style.display="flex";
  callStatus.innerText="Calling...";

  localStream=await navigator.mediaDevices.getUserMedia({audio:true});
  pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});

  pc.ontrack=e=>remoteAudio.srcObject=e.streams[0];

  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));

  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);

  set(callRef,{offer,from:uid});
}

/* LISTEN */
onValue(callRef,async snap=>{
  let data=snap.val();
  if(!data) return;

  if(data.from!==uid && data.offer && !data.answer){
    incoming.style.display="flex";

    accept.onclick=async()=>{
      incoming.style.display="none";
      callScreen.style.display="flex";

      localStream=await navigator.mediaDevices.getUserMedia({audio:true});
      pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});

      pc.ontrack=e=>remoteAudio.srcObject=e.streams[0];
      localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));

      await pc.setRemoteDescription(data.offer);
      const ans=await pc.createAnswer();
      await pc.setLocalDescription(ans);

      set(ref(db,"call/answer"),ans);
      callStatus.innerText="Connected";
    };

    reject.onclick=()=>remove(callRef);
  }

  if(data.answer && pc && !pc.currentRemoteDescription){
    await pc.setRemoteDescription(data.answer);
    callStatus.innerText="Connected";
  }
});

/* MUTE */
mute.onclick=()=>{
  let track=localStream.getAudioTracks()[0];
  track.enabled=!track.enabled;
  mute.innerText=track.enabled?"🔇":"🔊";
};

/* END */
endCall.onclick=()=>{
  callScreen.style.display="none";
  remove(callRef);
  if(pc) pc.close();
};
</script>

</body>
</html>
