<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Voice Call Pro - Working</title>
<style>
  body{margin:0;font-family:sans-serif;background:#0a0f1e;color:#fff;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
  #online{position:fixed;top:10px;right:10px;background:#1db954;padding:8px 15px;border-radius:20px;font-weight:bold;font-size:14px}
  button{padding:15px 30px;margin:10px;border:none;border-radius:50px;font-size:18px;cursor:pointer;transition:0.3s;font-weight:bold}
  #callBtn{background:#1db954;color:white}
  #callBtn:hover{background:#1ed760}
  
  #callUI, #incoming{position:fixed;inset:0;background:rgba(10,15,30,0.98);display:none;justify-content:center;align-items:center;flex-direction:column;z-index:100}
  #controls{margin-top:30px;display:flex;gap:25px}
  .round-btn{width:70px;height:70px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:24px}
  #end{background:#ff3b30;color:#fff}
  #mute{background:#3a3a3c;color:#fff}
  #accept{background:#34c759;color:#fff}
  #reject{background:#ff3b30;color:#fff}
</style>
</head>
<body>

<div id="online">Checking...</div>
<h2>🎧 High-Quality Voice</h2>
<p>UID: <span id="myId">...</span></p>
<button id="callBtn">📞 Global Call</button>

<div id="callUI">
  <h2 id="status">Connecting...</h2>
  <div id="controls">
    <button id="mute" class="round-btn">🎤</button>
    <button id="end" class="round-btn">❌</button>
  </div>
</div>

<div id="incoming">
  <h2 id="callerName">📞 Someone is calling...</h2>
  <div style="display:flex">
    <button id="accept">Accept</button>
    <button id="reject">Reject</button>
  </div>
</div>

<audio id="remoteAudio" autoplay></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, set, push, onValue, remove, onDisconnect, onChildAdded } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC8mmwZ_H-jTPNfZsTXIymIuD_wHN0KaXk",
  databaseURL: "https://wechat-34e85-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const uid = localStorage.getItem("uid") || Math.random().toString(36).slice(2, 8);
localStorage.setItem("uid", uid);
document.getElementById('myId').innerText = uid;

let pc, localStream, currentCallId = null;
const iceConfig = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] };

// Online Presence Logic
set(ref(db, `online/${uid}`), true);
onDisconnect(ref(db, `online/${uid}`)).remove();
onValue(ref(db, "online"), s => {
  const count = s.val() ? Object.keys(s.val()).length : 0;
  document.getElementById('online').innerText = `● ${count} Online`;
});

// Setup WebRTC Function
async function setupWebRTC(id) {
  pc = new RTCPeerConnection(iceConfig);
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  pc.ontrack = e => { remoteAudio.srcObject = e.streams[0]; };
  
  pc.onicecandidate = e => {
    if (e.candidate) {
      push(ref(db, `calls/${id}/ice_${uid}`), e.candidate.toJSON());
    }
  };

  // Listen for other person's ICE candidates
  const otherUid = ""; // Dynamic in real scenarios
  onChildAdded(ref(db, `calls/${id}/ice_other`), (snap) => {
    if (snap.val()) pc.addIceCandidate(new RTCIceCandidate(snap.val()));
  });
}

// Start Call (Caller side)
callBtn.onclick = async () => {
  currentCallId = uid + "_call";
  status.innerText = "Calling...";
  callUI.style.display = "flex";

  await setupWebRTC(currentCallId);
  
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await set(ref(db, `calls/${currentCallId}`), {
    offer: { type: offer.type, sdp: offer.sdp },
    from: uid,
    status: "pending"
  });

  // Watch for Answer
  onValue(ref(db, `calls/${currentCallId}/answer`), async snap => {
    if (snap.val() && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
      status.innerText = "Connected";
    }
  });

  // Listen for Caller ICE
  onChildAdded(ref(db, `calls/${currentCallId}/ice_receiver`), snap => {
    pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(e => {});
  });
};

// Listen for Incoming (Receiver side)
onValue(ref(db, "calls"), snap => {
  const data = snap.val();
  if (!data) return;
  
  Object.entries(data).forEach(async ([id, call]) => {
    if (call.from !== uid && call.status === "pending") {
      incoming.style.display = "flex";
      currentCallId = id;

      accept.onclick = async () => {
        incoming.style.display = "none";
        callUI.style.display = "flex";
        status.innerText = "Connecting...";

        await setupWebRTC(id);

        await pc.setRemoteDescription(new RTCSessionDescription(call.offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        await set(ref(db, `calls/${id}/answer`), { type: answer.type, sdp: answer.sdp });
        await set(ref(db, `calls/${id}/status`), "active");
        status.innerText = "Connected";
      };

      // Listen for Receiver ICE
      onChildAdded(ref(db, `calls/${id}/ice_${call.from}`), snap => {
        pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(e => {});
      });
      
      reject.onclick = () => remove(ref(db, `calls/${id}`));
    }
  });
});

// End Call Logic
const cleanup = () => {
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (pc) pc.close();
  callUI.style.display = "none";
  incoming.style.display = "none";
  if (currentCallId) remove(ref(db, `calls/${currentCallId}`));
};

end.onclick = cleanup;
mute.onclick = () => {
  const t = localStream.getAudioTracks()[0];
  t.enabled = !t.enabled;
  mute.innerText = t.enabled ? "🎤" : "🔇";
};
</script>
</body>
</html>
