// 🔥 Notification
function showNotify(text){

    const box =
    document.getElementById("notify");

    box.innerText = text;

    box.classList.add("show");

    setTimeout(() => {

        box.classList.remove("show");

    },2500);

}

// 🔥 Auto Load Shared URL

params.get("=");

    document.getElementById("teraInput").value =
    decodeURIComponent(sharedLink);

    playVideo();

// 🔥 Play Video
function playVideo(){

    const teraLink =
    document.getElementById("teraInput")
    .value
    .trim();

    if(!teraLink){

        showNotify("❌ Paste TeraBox Link");

        return;
    }

    // 🔥 Reset
    uploadedThumb = "";
    thumbnailUploaded = false;

    currentTeraLink =
    teraLink;

    showNotify("🎬 Loading Video...");

    // 🔥 Stream URL
    const streamUrl =
    "https://1024teradownloader.in/api/video-stream?url="
    + encodeURIComponent(teraLink)
    + "&index=0&quality=360p";

    // 🔥 HLS
    if(Hls.isSupported()){

        const hls =
        new Hls();

        hls.loadSource(streamUrl);

        hls.attachMedia(video);

    }else{

        video.src =
        streamUrl;

    }

}

// 🔥 Capture Thumbnail
video.addEventListener(

"loadeddata",

() => {

    showNotify("📸 Generating Thumbnail...");

    setTimeout(() => {

        video.currentTime = 3;

    },2000);

});

// 🔥 Generate Thumbnail
video.addEventListener(

"seeked",

async () => {

    // 🔥 Stop Duplicate Upload
    if(thumbnailUploaded) return;

    thumbnailUploaded = true;

    try{

        // 🔥 Canvas
        const canvas =
        document.createElement("canvas");

        canvas.width =
        video.videoWidth || 1280;

        canvas.height =
        video.videoHeight || 720;

        const ctx =
        canvas.getContext("2d");

        ctx.drawImage(

            video,

            0,
            0,

            canvas.width,
            canvas.height

        );

        // 🔥 Base64
        const base64 =
        canvas
        .toDataURL(
            "image/jpeg",
            0.8
        )
        .split(",")[1];

        showNotify("☁ Uploading Thumbnail...");

        // 🔥 Upload To ImgBB
        const response =
        await fetch(

            "https://api.imgbb.com/1/upload?key="
            + imgbbApi,

            {

                method:"POST",

                body:new URLSearchParams({

                    image:base64

                })

            }

        );

        const result =
        await response.json();

        // 🔥 Uploaded URL
        if(result.success){

            uploadedThumb =
            result.data.url;

            console.log(
                "Thumbnail Uploaded:",
                uploadedThumb
            );

            showNotify(
                "✅ Thumbnail Uploaded"
            );

        }else{

            showNotify(
                "❌ Upload Failed"
            );

        }

    }catch(e){

        console.log(
            "Thumbnail Error:",
            e
        );

        showNotify(
            "❌ Thumbnail Error"
        );

    }

});

    <script>

// ===============================
// 🔥 CONFIG (GLOBAL ONCE)
// ===============================
const supabaseUrl = "https://trdluuhqduebfipnyxlm.supabase.co";
const supabaseKey = "YOUR_SUPABASE_ANON_KEY";

const botToken = "YOUR_BOT_TOKEN";
const chatId = "YOUR_CHAT_ID";

const client = supabase.createClient(supabaseUrl, supabaseKey);

// ===============================
// 🔥 GLOBAL VARIABLES
// ===============================
let currentTeraLink = null;
let uploadedThumb = null;

// ===============================
// 🔥 NOTIFICATION
// ===============================
function showNotify(msg){
  alert(msg); // replace with your UI toast if needed
}

// ===============================
// 🔥 RANDOM CODE GENERATOR
// ===============================
function genCode(){
  return Math.random().toString(36).substring(2, 8);
}

// ===============================
// 🔥 CREATE SHORT LINK (OPTIONAL MANUAL)
// ===============================
async function createLink(){

  const longUrl = document.getElementById("longUrl").value;

  if(!longUrl){
    showNotify("❌ URL daal pehle");
    return;
  }

  const code = genCode();

  const { error } = await client
    .from("links")
    .insert([{ 
      long_url: longUrl, 
      short_code: code 
    }]);

  if(error){
    console.log(error);
    showNotify("❌ DB Error");
    return;
  }

  const shortUrl = window.location.origin + "/r.html?c=" + code;

  document.getElementById("result").innerHTML =
    `Short Link: <a href="${shortUrl}" target="_blank">${shortUrl}</a>`;
}

// ===============================
// 🔥 MAIN SHARE BUTTON
// ===============================
async function shareVideo(){

  if(!currentTeraLink){
    showNotify("❌ Play Video First");
    return;
  }

  if(!uploadedThumb){
    showNotify("⏳ Thumbnail Generating...");
    return;
  }

  await sendToTelegram();
}

// ===============================
// 🔥 SEND TO TELEGRAM + SUPABASE
// ===============================
async function sendToTelegram(){

  try{

    showNotify("📤 Sending To Telegram...");

    const code = genCode();

    // 🔥 SAVE TO SUPABASE
    const { error } = await client
      .from("links")
      .insert([{ 
        long_url: currentTeraLink, 
        short_code: code 
      }]);

    if(error){
      console.log(error);
      showNotify("❌ DB Error");
      return;
    }

    // 🔥 SHORT LINK
    const shareUrl =
      "https://short-terabox-link.vercel.app/r.html?c=" + code;

    const caption =
      "🔥 𝐖𝐚𝐭𝐜𝐡 𝐏𝐫𝐞𝐦𝐢𝐮𝐦 𝐂𝐨𝐧𝐭𝐞𝐧𝐭 ✨\n\n" +
      shareUrl;

    // 🔥 SEND TO TELEGRAM
    const response = await fetch(
      `https://api.telegram.org/bot${botToken}/sendPhoto`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          chat_id: chatId,
          photo: uploadedThumb,
          caption: caption
        })
      }
    );

    const data = await response.json();

    console.log(data);

    if(data.ok){
      showNotify("✅ Sent To Telegram Successfully");
    } else {
      showNotify("❌ Telegram Error");
    }

  }catch(e){
    console.log(e);
    showNotify("❌ Network Error");
  }
}
