<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Supabase Shortlink System</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  background:#020617;
  font-family:Arial;
}
.glow{
  box-shadow:0 0 25px rgba(0,255,255,0.15);
}
</style>
</head>

<body class="flex items-center justify-center min-h-screen p-5">

<div class="w-full max-w-xl bg-slate-900 border border-cyan-500 rounded-3xl p-6 glow">

<h1 class="text-3xl font-bold text-cyan-400 text-center mb-6">
⚡ Shortlink System
</h1>

<input
id="urlInput"
type="text"
placeholder="Paste Long URL..."
class="w-full p-4 rounded-xl bg-slate-800 text-white outline-none mb-4 border border-slate-700"
/>

<button
onclick="createShortLink()"
class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-bold p-4 rounded-xl"
>
Generate Shortlink
</button>

<!-- hidden क्लास वापस जोड़ दी है ताकि शुरू में बॉक्स न दिखे -->
<div id="resultBox" class="hidden mt-6 bg-slate-800 p-4 rounded-xl border border-cyan-500">

<p class="text-gray-300 mb-2">Your Shortlink:</p>

<div class="flex gap-2">

<input
id="shortlink"
readonly
class="flex-1 p-3 rounded-lg bg-slate-900 text-cyan-300 outline-none"
/>

<button
onclick="copyLink()"
class="bg-green-500 px-4 rounded-lg font-bold"
>
Copy
</button>

</div>

<p id="msg" class="text-green-400 mt-3 text-sm"></p>

</div>

</div>

<script>

// ================= SUPABASE =================
const SUPABASE_URL = "https://trdluuhqduebfipnyxlm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGx1dWhxZHVlYmZpcG55eGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzgyMTUsImV4cCI6MjA5NTAxNDIxNX0.43O4uPz6Jej4-9JAtuOEt7hD7W6lPN1Z0aE6ieHfBF4";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ================= RANDOM CODE =================
function generateCode(len=6){
  const c="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let r="";
  for(let i=0;i<len;i++){
    r+=c[Math.floor(Math.random()*c.length)];
  }
  return r;
}

// ================= CREATE SHORTLINK =================
async function createShortLink(){
  const url = document.getElementById("urlInput").value.trim();

  if(!url){
    alert("Enter URL");
    return;
  }

  let code = generateCode();

  // save to supabase
  const { error } = await supabase
    .from("shortlinks")
    .insert([{ original_url: url, short_code: code }]);

  if(error){
    alert("Supabase Error: " + error.message);
    return;
  }

  // Vercel/Domain के हिसाब से सही URL बनाना
  const short = window.location.origin + "/" + code;

  // SHOW UI
  document.getElementById("resultBox").classList.remove("hidden");
  document.getElementById("shortlink").value = short;
  document.getElementById("msg").innerText = "Link generated ✔";
}

// ================= COPY =================
function copyLink(){
  const input = document.getElementById("shortlink");
  input.select();
  document.execCommand("copy");
  document.getElementById("msg").innerText = "Copied ✔";
}

// ================= REDIRECT SYSTEM =================
async function redirectSystem(){
  // स्लैश हटाने का बेहतर तरीका ताकि रूटीन गड़बड़ न हो
  const path = window.location.pathname.split('/').filter(Boolean)[0];

  // अगर कोई पाथ नहीं है या index.html है तो रुक जाओ
  if(!path || path === "index.html") return;

  const { data, error } = await supabase
    .from("shortlinks")
    .select("original_url")
    .eq("short_code", path)
    .single();

  if (data && data.original_url) {
    window.location.href = data.original_url;
  }
}

// ================= API SYSTEM =================
// ?api=create&url=xxxx
async function apiSystem(){
  const params = new URLSearchParams(window.location.search);
  const api = params.get("api");
  const url = params.get("url");

  if(api !== "create") return;

  if(!url){
    document.body.innerHTML = JSON.stringify({
      status:false,
      message:"URL Missing"
    });
    return;
  }

  const code = generateCode();

  const { error } = await supabase
    .from("shortlinks")
    .insert([{ original_url: url, short_code: code }]);

  if(error) {
    document.body.innerHTML = JSON.stringify({ status: false, message: error.message });
    return;
  }

  const shortUrl = window.location.origin + "/" + code;

  document.body.innerHTML = `
    <pre style="color:#00ffcc;padding:20px;font-size:16px;background:#020617;height:100vh;">
${JSON.stringify({
  status:true,
  shortlink:shortUrl,
  code:code,
  url:url
},null,2)}
    </pre>
  `;
}

// दोनों सिस्टम को रन करना जरूरी है
redirectSystem();
apiSystem();

</script>

</body>
</html>
