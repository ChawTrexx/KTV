<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeChat Pro</title>

<style>
body{margin:0;font-family:sans-serif;background:#000;color:#fff}

/* HEADER */
header{background:#111;padding:12px;display:flex;justify-content:space-between}
#callBtn{background:#1e90ff;border:none;padding:8px 12px;border-radius:8px;color:#fff}

/* CHAT */
#messages{height:65vh;overflow:auto;padding:10px}
.msg{background:#1a1a1a;padding:8px;border-radius:8px;margin:5px;max-width:75%}
.me{background:#1e90ff;margin-left:auto}

/* INPUT */
footer{position:fixed;bottom:0;width:100%;display:flex;background:#111;padding:10px}
#msgInput{flex:1;padding:10px;border:none;border-radius:20px;background:#222;color:#fff}
#sendBtn{margin-left:8px;background:#1e90ff;border:none;padding:10px;border-radius:50%}

/* 📞 CALL SCREEN */
#callScreen{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:#000;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
}

#callName{font-size:22px;margin-bottom:5px}
#callStatus{font-size:14px;color:#aaa;margin-bottom:20px}

.callBtns{
  position:absolute;
  bottom:40px;
  display:flex;
  gap:20px;
}

.callBtns button{
  width:60px;height:60px;
  border-radius:50%;
  border:none;
  font-size:18px;
}

#endCall{background:red;color:#fff}
#mute{background:#333;color:#fff}

/* INCOMING */
#incoming{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:1000;
}
</style>
</head>

<body>

<header>
  <h3>🔥 WeChat</h3>
  <button id="callBtn">📞 Call</button>
</header>

<div id="messages"></div>

<footer>
  <input id="msgInput" placeholder="Message">
  <button id="sendBtn">➤</button>
</footer>

<!-- 📞 CALL UI -->
<div id="callScreen">
  <div id="callName">Calling...</div>
  <div id="callStatus">Connecting...</div>

  <div class="callBtns">
    <button id="mute">🔇</button>
    <button id="endCall">❌</button>
  </div>
</div>

<!-- 📞 INCOMING -->
<div id="incoming">
  <h2>📞 Incoming Call</h2>
  <button id="accept">✅ Accept</button>
  <button id="reject">❌ Reject</button>
</div>

<audio id="remoteAudio" autoplay></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getDatabase, ref, push, set, onChildAdded, remove, onValue } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

const config={
 apiKey:"AIzaSyA_IGhhpYGsJDy1M9VPH-NXY561BF31mgg",
 databaseURL:"https://wechat-eee4d-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app=initializeApp(config);
const db=getDatabase(app);

let username=localStorage.getItem("u")||prompt("Name?");
localStorage.setItem("u",username);

const chatRef=ref(db,"chat");

// CHAT SEND
sendBtn.onclick=()=>{
  if(!msgInput.value) return;
  push(chatRef,{user:username,text:msgInput.value});
  msgInput.value="";
};

// SHOW MSG
onChildAdded(chatRef,s=>{
  let d=s.val();
  let div=document.createElement("div");
  div.className="msg "+(d.user===username?"me":"");
  div.innerText=d.user+": "+d.text;
  messages.appendChild(div);
});

// ================== CALL ==================

let pc,localStream;
const uid=Math.random().toString(36).slice(2);
const callRef=ref(db,"call");

callBtn.onclick=startCall;

async function startCall(){
  callScreen.style.display="flex";
  callStatus.innerText="Calling...";
  
  localStream=await navigator.mediaDevices.getUserMedia({audio:true});
  pc=new RTCPeerConnection({
    iceServers:[{urls:'stun:stun.l.google.com:19302'}]
  });

  pc.ontrack=e=>{
    remoteAudio.srcObject=e.streams[0];
  };

  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));

  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);

  set(callRef,{offer,from:uid});
}

// LISTEN CALL
onValue(callRef,async snap=>{
  let data=snap.val();
  if(!data) return;

  if(data.from!==uid && data.offer && !data.answer){
    incoming.style.display="flex";

    accept.onclick=async()=>{
      incoming.style.display="none";
      callScreen.style.display="flex";

      localStream=await navigator.mediaDevices.getUserMedia({audio:true});
      pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});

      pc.ontrack=e=>{
        remoteAudio.srcObject=e.streams[0];
      };

      localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));

      await pc.setRemoteDescription(data.offer);
      const ans=await pc.createAnswer();
      await pc.setLocalDescription(ans);

      set(ref(db,"call/answer"),ans);
      callStatus.innerText="Connected";
    };

    reject.onclick=()=>remove(callRef);
  }

  if(data.answer && pc && !pc.currentRemoteDescription){
    await pc.setRemoteDescription(data.answer);
    callStatus.innerText="Connected";
  }
});

// MUTE
mute.onclick=()=>{
  localStream.getAudioTracks()[0].enabled =
  !localStream.getAudioTracks()[0].enabled;
};

// END
endCall.onclick=()=>{
  callScreen.style.display="none";
  remove(callRef);
  if(pc) pc.close();
};
</script>

</body>
</html>
