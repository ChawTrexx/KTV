<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeraBox Video Player</title>
  <!-- HLS.js Library for M3U8 Video Playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h2 {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #333333;
      background-color: #1a1a1a;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #e91e63;
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background-color: #e91e63;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #d81b60;
    }
    button:disabled {
      background-color: #555555;
      cursor: not-allowed;
    }
    #status {
      font-size: 14px;
      color: #aaaaaa;
      min-height: 20px;
    }
    .player-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #222222;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>TeraBox Video Player</h2>
  
  <div class="input-group">
    <input type="text" id="teraboxUrl" placeholder="https://terasharefile.com/s/..." />
    <button id="playBtn" onclick="playVideo()">Play Video</button>
  </div>
  
  <div id="status"></div>

  <div class="player-box">
    <video id="videoPlayer" controls></video>
  </div>
</div>

<script>
async function playVideo() {
  const urlInput = document.getElementById('teraboxUrl').value.trim();
  const status = document.getElementById('status');
  const video = document.getElementById('videoPlayer');
  const btn = document.getElementById('playBtn');

  if (!urlInput) {
    status.innerText = "Please paste a valid TeraBox link.";
    status.style.color = "#ff5252";
    return;
  }

  status.innerText = "Fetching stream link...";
  status.style.color = "#aaaaaa";
  btn.disabled = true;

  try {
    // Vercel Serverless Function Proxy Endpoint Call
    const response = await fetch('/api/get-stream', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        url: urlInput
      })
    });

    const data = await response.json();

    // Extract stream URL from server response
    const streamUrl = data?.url || data?.stream_url || data?.fast_stream;

    if (streamUrl) {
      status.innerText = "Playing Video...";
      status.style.color = "#4caf50";
      
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Native HLS support for Safari / iOS
        video.src = streamUrl;
        video.play();
      } else {
        // Fallback for direct playable URLs
        video.src = streamUrl;
        video.play();
      }
    } else {
      status.innerText = "Error: Failed to fetch stream URL. Check the link.";
      status.style.color = "#ff5252";
    }
  } catch (error) {
    console.error(error);
    status.innerText = "Error connecting to Vercel API backend.";
    status.style.color = "#ff5252";
  } finally {
    btn.disabled = false;
  }
}
</script>

</body>
</html>
