<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shortlink System (Supabase)</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  background:#020617;
  font-family:Arial;
}
.glow{
  box-shadow:0 0 30px rgba(0,255,255,0.15);
}
</style>
</head>

<body class="min-h-screen flex items-center justify-center p-5">

<div class="w-full max-w-2xl bg-slate-900 border border-cyan-500 rounded-3xl p-6 glow">

<h1 class="text-4xl font-bold text-cyan-400 text-center mb-6">
⚡ Supabase Shortlink System
</h1>

<input
id="urlInput"
type="text"
placeholder="Paste Long URL..."
class="w-full p-4 rounded-2xl bg-slate-800 text-white outline-none border border-slate-700 mb-4"
/>

<button
onclick="createShortLink()"
class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-bold p-4 rounded-2xl"
>
Generate Shortlink
</button>

<div id="resultBox" class="hidden mt-6">

<p class="text-slate-400 mb-2">Generated Shortlink</p>

<div class="flex gap-2">

<input
id="shortlink"
readonly
class="flex-1 p-3 rounded-xl bg-slate-800 text-cyan-400 outline-none"
/>

<button
onclick="copyLink()"
class="bg-green-500 px-5 rounded-xl font-bold"
>
Copy
</button>

</div>
</div>

</div>

<script>
// ======================
// SUPABASE CONFIG
// ======================
const SUPABASE_URL = "https://trdluuhqduebfipnyxlm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGx1dWhxZHVlYmZpcG55eGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzgyMTUsImV4cCI6MjA5NTAxNDIxNX0.43O4uPz6Jej4-9JAtuOEt7hD7W6lPN1Z0aE6ieHfBF4";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ======================
// GENERATE CODE
// ======================
function generateCode(len = 6){
  const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let out = "";
  for(let i=0;i<len;i++){
    out += chars[Math.floor(Math.random()*chars.length)];
  }
  return out;
}

// ======================
// CREATE SHORTLINK
// ======================
async function createShortLink(){

const longUrl = document.getElementById("urlInput").value.trim();
if(!longUrl){
  alert("Enter URL");
  return;
}

let code = generateCode();

// insert (retry if duplicate)
let inserted = false;

while(!inserted){

const { error } = await supabase
.from("shortlinks")
.insert([{
  original_url: longUrl,
  short_code: code
}]);

if(!error){
  inserted = true;
}else{
  code = generateCode();
}

}

const shortUrl = window.location.origin + "/" + code;

document.getElementById("resultBox").classList.remove("hidden");
document.getElementById("shortlink").value = shortUrl;

}

// ======================
// COPY
// ======================
function copyLink(){
  const input = document.getElementById("shortlink");
  input.select();
  document.execCommand("copy");
  alert("Copied!");
}

// ======================
// REDIRECT SYSTEM
// ======================
async function redirectSystem(){

const path = window.location.pathname.replace("/","").replace("index.html","");

if(!path) return;

const { data } = await supabase
.from("shortlinks")
.select("*")
.eq("short_code", path)
.single();

if(data){
  window.location.href = data.original_url;
}

}

redirectSystem();

</script>

</body>
</html>
