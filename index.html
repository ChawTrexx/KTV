<video id="myPlayer" controls width="100%" poster=""></video>

<script>
async function loadTeraboxVideo(teraboxUrl) {
  try {
    // Active free API endpoint
    const response = await fetch(`https://terabox-dl.qt0.workers.dev/api?url=${encodeURIComponent(teraboxUrl)}`);
    const data = await response.json();
    
    if(data && data.stream_url) {
      const videoElement = document.getElementById('myPlayer');
      videoElement.src = data.stream_url;
      videoElement.play();
    } else {
      alert("Video link decode nahi ho paya.");
    }
  } catch (error) {
    console.error("Error loading video:", error);
  }
}

// Apna TeraBox Link Yahan Daalein
loadTeraboxVideo("https://terafileshare.com/s/1bVmwAt8ODVMmzJkYd6P9pA");
</script>
