<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2 User Voice Call</title>

<style>
body{
    margin:0;
    background:#0a0f1e;
    color:#fff;
    font-family:sans-serif;
    text-align:center;
}
#box{
    margin-top:50px;
}
input{
    padding:10px;
    border-radius:10px;
    border:none;
    width:200px;
}
button{
    padding:10px 20px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    margin:10px;
}
#call{background:#1db954;color:#fff;}
#end{background:red;color:#fff;}
.overlay{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:#000;
}
</style>
</head>

<body>

<div id="box">
    <h2>Enter Your ID</h2>
    <input id="name" placeholder="Enter Name">
    <br>
    <button onclick="start()">Start</button>
</div>

<h3 id="myId"></h3>
<button id="call" onclick="callUser()" style="display:none;">📞 Call</button>

<div id="callUI" class="overlay">
    <h2 id="status">Calling...</h2>
    <button id="end" onclick="endCall()">End</button>
</div>

<audio id="remoteAudio" autoplay></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyC8mmwZ_H-jTPNfZsTXIymIuD_wHN0KaXk",
    authDomain: "wechat-34e85.firebaseapp.com",
    databaseURL: "https://wechat-34e85-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "wechat-34e85"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let uid, pc, localStream;

const iceServers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
const callRef = ref(db, "call");

// 🔹 Start with custom ID
window.start = () => {
    const name = document.getElementById("name").value.trim();
    if(!name) return alert("Enter name");

    uid = name;

    localStorage.setItem("uid", uid);

    document.getElementById("box").style.display="none";
    document.getElementById("myId").innerText = "Your ID: " + uid;
    document.getElementById("call").style.display="inline-block";

    listenCall();
};

// 🔹 Auto load saved ID
window.onload = () => {
    const saved = localStorage.getItem("uid");
    if(saved){
        document.getElementById("name").value = saved;
        start();
    }
};

// 🔹 Setup media
async function setup(isCaller){
    localStream = await navigator.mediaDevices.getUserMedia({audio:true});
    pc = new RTCPeerConnection(iceServers);

    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    pc.ontrack = e => {
        document.getElementById("remoteAudio").srcObject = e.streams[0];
    };

    pc.onicecandidate = e => {
        if(e.candidate){
            set(ref(db,"call/ice"), e.candidate.toJSON());
        }
    };

    onValue(ref(db,"call/ice"), snap=>{
        if(snap.val()) pc.addIceCandidate(new RTCIceCandidate(snap.val()));
    });
}

// 🔹 Call button
window.callUser = async () => {
    document.getElementById("callUI").style.display="flex";

    await setup(true);

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await set(callRef,{
        offer,
        from: uid
    });

    onValue(ref(db,"call/answer"), async snap=>{
        if(snap.val() && !pc.currentRemoteDescription){
            await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
            document.getElementById("status").innerText="Connected";
        }
    });
};

// 🔹 Listen incoming
function listenCall(){
    onValue(callRef, async snap=>{
        const data = snap.val();
        if(!data) return;

        if(data.from !== uid && data.offer){
            if(confirm("Incoming call from " + data.from)){
                document.getElementById("callUI").style.display="flex";

                await setup(false);

                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));

                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                await set(ref(db,"call/answer"), answer);

                document.getElementById("status").innerText="Connected";
            }
        }
    });
}

// 🔹 End call
window.endCall = () => {
    remove(callRef);
    location.reload();
};

</script>
</body>
</html>
