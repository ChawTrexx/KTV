<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeraBox Stream Player</title>
  <!-- HLS.js Library for M3U8 Streaming -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .player-card { background: #1e293b; border-radius: 12px; width: 100%; max-width: 750px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .input-box { display: flex; gap: 10px; margin-bottom: 15px; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
    button { padding: 12px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button:hover { background: #1d4ed8; }
    .video-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 8px; overflow: hidden; margin-top: 10px; }
    video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .video-title { margin-top: 12px; font-size: 16px; font-weight: 600; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .status-msg { margin-top: 8px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>

<div class="player-card">
  <div class="input-box">
    <input type="text" id="teraboxUrl" placeholder="TeraBox share link yahan dalein..." value="https://terasharefile.com/s/1FT6cGqK59ZI4piQTieAQug">
    <button onclick="loadAndPlay()">Play Video</button>
  </div>

  <div class="video-container">
    <video id="mainPlayer" controls poster=""></video>
  </div>

  <div id="videoTitle" class="video-title"></div>
  <div id="statusMsg" class="status-msg"></div>
</div>

<script>
  let hlsInstance = null;

  async function loadAndPlay() {
    const linkInput = document.getElementById('teraboxUrl').value.trim();
    const status = document.getElementById('statusMsg');
    const title = document.getElementById('videoTitle');
    const video = document.getElementById('mainPlayer');

    if (!linkInput) {
      status.innerText = "Kripya valid TeraBox URL dalein.";
      return;
    }

    status.innerText = "API se video details fetch ho rahi hain...";
    title.innerText = "";

    // API endpoint
    const apiEndpoint = `https://teradiskplayer.com/api/get-video?url=${encodeURIComponent(linkInput)}`;

    try {
      const response = await fetch(apiEndpoint);
      const data = await response.json();

      if (data.success && data.directUrl) {
        status.innerText = "";
        title.innerText = data.title || "TeraBox Video";
        if (data.thumb) video.poster = data.thumb;

        // Purana HLS instance destroy karein agar pehle se chal raha ho
        if (hlsInstance) {
          hlsInstance.destroy();
        }

        // HLS Stream (.m3u8) Play Logic
        if (Hls.isSupported()) {
          hlsInstance = new Hls();
          hlsInstance.loadSource(data.directUrl);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play();
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          // Safari browser ke liye native support
          video.src = data.directUrl;
          video.play();
        } else {
          status.innerText = "Aapka browser HLS streaming support nahi karta.";
        }
      } else {
        status.innerText = "Video fetch nahi ho paya. Invalid Link ya API Issue.";
      }
    } catch (err) {
      console.error(err);
      status.innerText = "Error: API Request fail ho gayi (CORS ya network problem).";
    }
  }
</script>

</body>
</html>
