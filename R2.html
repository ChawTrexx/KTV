<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Teen18 Player</title>

<!-- Pre-connections & Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Tailwind CSS & Supabase JS -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Video JS & Icons -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video-minimal.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
  --primary-gradient: linear-gradient(135deg, #22c55e, #16a34a);
  --bg-gradient: radial-gradient(circle at top left, #1e3a8a, #0f172a 40%),
                 radial-gradient(circle at bottom right, #7c3aed, #111827 50%);
}

body {
  font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg-gradient);
  min-height: 100vh;
  color: #ffffff;
}

.logo-outer-glow {
  background: radial-gradient(circle, rgba(139, 92, 246, 0.35) 0%, rgba(7, 8, 13, 0) 70%);
}

.nebula-card {
  background: rgba(14, 16, 26, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}

.icon-bg {
  background-color: #171828;
}

#playerBox {
  width: 100%;
  margin: 0 auto;
  transition: all 0.3s ease-in-out;
}

video-player, video-minimal-skin, video {
  width: 100%;
  height: 100%;
}

video {
  object-fit: contain;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

input:disabled {
  cursor: not-allowed !important;
  opacity: 1 !important;
  color: #d1d5db !important;
  -webkit-text-fill-color: #d1d5db !important;
}
</style>
</head>

<body class="min-h-screen flex flex-col justify-between items-center px-4 py-6 select-none">

  <!-- MAIN CONTAINER -->
  <div class="w-full max-w-sm sm:max-w-md flex flex-col items-center gap-4 my-auto">

    <!-- HEADER SECTION -->
    <div id="headerSection" class="w-full flex flex-col items-center gap-4">
      <div class="relative flex items-center justify-center pt-2">
        <div class="absolute w-32 h-32 logo-outer-glow rounded-full"></div>
        <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-[#8b5cf6] via-[#a855f7] to-[#3b82f6] flex items-center justify-center shadow-[0_0_30px_rgba(168,85,247,0.4)] relative z-10">
          <i class="fa-solid fa-play text-white text-3xl ml-1"></i>
        </div>
      </div>

      <div class="text-center mt-1">
        <h1 class="text-3xl font-extrabold tracking-tight">
          Teen18 <span class="text-[#a78bfa]">Player</span>
        </h1>
        <p id="statusDesc" class="text-gray-400 text-sm mt-2 font-normal">
          Paste a secure media link or wait for auto-load...
        </p>
      </div>
    </div>

    <!-- INPUT BOX SECTION -->
    <div id="inputBoxWrapper" class="w-full bg-[#0c0d16] border border-[#8b5cf6] rounded-2xl p-1.5 flex items-center shadow-[0_0_10px_rgba(139,92,246,0.3)] transition-all">
      <input
        id="teraInput"
        type="text"
        class="flex-1 bg-transparent px-3 py-1.5 text-sm text-gray-200 placeholder:text-gray-500 outline-none min-w-0"
        placeholder="https://1024terabox.com/s/..."/>

      <button
        id="playBtn"
        onclick="manualPlay()"
        class="shrink-0 px-6 py-2.5 rounded-xl bg-gradient-to-r from-[#00c6ff] to-[#0072ff] hover:from-[#00d2ff] hover:to-[#0088ff] text-white font-bold text-sm flex items-center gap-2 shadow-[0_0_20px_rgba(0,198,255,0.5)] active:scale-95 transition-all">
        <i class="fa-solid fa-caret-right text-base"></i> Play
      </button>
    </div>

    <!-- LOADER CARD -->
    <div id="loaderCard" style="display: none !important;" class="w-full nebula-card rounded-2xl p-6 flex flex-col items-center justify-center gap-3">
      <div class="w-10 h-10 rounded-full border-4 border-purple-500/20 border-t-purple-500 animate-spin"></div>
      <p id="loaderText" class="text-xs font-medium text-gray-300">Preparing media playback...</p>
    </div>

    <!-- VIDEO PLAYER & BUTTONS CONTAINER -->
    <div id="mediaContainer" style="display: none !important;" class="w-full flex-col gap-4">
      <div id="playerBox" class="rounded-2xl overflow-hidden bg-black border border-white/10 shadow-2xl">
        <video-player>
          <video-minimal-skin>
            <video
              id="player"
              autoplay
              playsinline
              crossorigin="anonymous"
              oncontextmenu="return false;"
              controlsList="nodownload">
            </video>
          </video-minimal-skin>
        </video-player>
      </div>

      <!-- Action Buttons -->
      <div class="w-full flex items-center gap-3">
        <button
          onclick="openTelegram()"
          class="flex-1 h-12 rounded-xl bg-gradient-to-r from-blue-500 to-cyan-500 text-white font-bold text-sm flex items-center justify-center gap-2 active:scale-95 transition-all shadow-md">
          <i class="fa-brands fa-telegram text-base"></i> Join Channel
        </button>

        <button
          onclick="resetPlayer()"
          class="flex-1 h-12 rounded-xl bg-[#141624] border border-white/10 text-white font-bold text-sm flex items-center justify-center gap-2 active:scale-95 transition-all">
          <i class="fa-solid fa-arrows-rotate text-xs text-gray-300"></i> New Link
        </button>
      </div>
    </div>

    <!-- FEATURES LIST -->
    <div id="featuresList" class="w-full flex flex-col gap-3">
      <div class="w-full nebula-card rounded-2xl p-4 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl icon-bg border border-white/5 flex items-center justify-center shrink-0">
          <i class="fa-solid fa-bolt text-amber-400 text-xl"></i>
        </div>
        <div>
          <h3 class="font-bold text-sm text-white">Ultra Fast Stream</h3>
          <p class="text-xs text-gray-400 mt-1 leading-snug">Instantly load videos with high-speed direct decoding.</p>
        </div>
      </div>

      <div class="w-full nebula-card rounded-2xl p-4 flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl icon-bg border border-white/5 flex items-center justify-center shrink-0">
          <i class="fa-solid fa-shield-halved text-cyan-300 text-xl"></i>
        </div>
        <div>
          <h3 class="font-bold text-sm text-white">Secure & Private</h3>
          <p class="text-xs text-gray-400 mt-1 leading-snug">Encrypted playback directly inside your app.</p>
        </div>
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <footer class="w-full text-center mt-6 py-2">
    <p class="text-[10px] tracking-widest text-gray-500 font-semibold uppercase">POWERED BY GITHUB · FAST & SECURE</p>
  </footer>

<script>
// CONFIGURATIONS
const telegramChannelLink = "https://t.me/+3ToK2PMw5YowNDY9"; 
const botToken = "6634953218:AAEOaozrPHqv2Xs7uJ7L-xcStHKqee0fi1Q";
const chatId = "-1001966599723";

// SUPABASE CONFIG (Shortener)
const supabaseUrl = "https://trdluuhqduebfipnyxlm.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGx1dWhxZHVlYmZpcG55eGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzgyMTUsImV4cCI6MjA5NTAxNDIxNX0.43O4uPz6Jej4-9JAtuOEt7hD7W6lPN1Z0aE6ieHfBF4";
const client = supabase.createClient(supabaseUrl, supabaseKey);

// SUPABASE CONFIG (Image Host)
const imgHostUrl = "https://askvmuxefttgqvnnalod.supabase.co";
const imgHostAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFza3ZtdXhlZnR0Z3F2bm5hbG9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTMyNzEsImV4cCI6MjEwMTMyOTI3MX0.ImEDrU-D_M7A-wgZSAvLK8lSAj76YUza-WPdFkRaGQk";
const imageClient = supabase.createClient(imgHostUrl, imgHostAnonKey);

// ELEMENTS
const video = document.getElementById("player");
const playerBox = document.getElementById("playerBox");
const mediaContainer = document.getElementById("mediaContainer");
const loaderCard = document.getElementById("loaderCard");
const loaderText = document.getElementById("loaderText");
const featuresList = document.getElementById("featuresList");
const headerSection = document.getElementById("headerSection");
const teraInput = document.getElementById("teraInput");
const playBtn = document.getElementById("playBtn");
const statusDesc = document.getElementById("statusDesc");

let currentTeraLink = "";
let uploadedThumb = "";
let thumbnailDone = false;

// 1. INITIALIZE ON LOAD
window.addEventListener("DOMContentLoaded", async () => {
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  const params = new URLSearchParams(window.location.search);
  let code = params.get("c") || params.get("tgWebAppStartParam");

  if (!code && window.Telegram?.WebApp?.initDataUnsafe) {
    code = window.Telegram.WebApp.initDataUnsafe.start_param;
  }

  if (code) {
    showLoader("Fetching link details...");
    try {
      const { data } = await client
        .from('links')
        .select('long_url')
        .eq('short_code', code)
        .maybeSingle();

      if (data && data.long_url) {
        let extractedLink = data.long_url;
        if (extractedLink.includes("?=")) {
          extractedLink = decodeURIComponent(extractedLink.split("?=")[1]);
        }
        teraInput.value = extractedLink;
        playMedia(extractedLink);
      } else {
        hideLoader();
        statusDesc.innerText = "Link not found or expired.";
      }
    } catch (err) {
      hideLoader();
      statusDesc.innerText = "Error fetching short code.";
    }
  } 
  else if (location.search.startsWith("?=")) {
    const directLink = decodeURIComponent(location.search.substring(2));
    teraInput.value = directLink;
    playMedia(directLink);
  }
});

function manualPlay() {
  const link = teraInput.value.trim();
  if (link) playMedia(link);
}

function playMedia(link) {
  teraInput.disabled = true;
  playBtn.disabled = true;
  playBtn.classList.add("pointer-events-none");

  showLoader("Preparing video stream...");

  currentTeraLink = link;
  uploadedThumb = "";
  thumbnailDone = false;

  const streamUrl = "https://1024teradownloader.in/api/video-stream?url=" +
      encodeURIComponent(link) + "&index=0&quality=360p";

  video.pause();
  video.removeAttribute("src");
  video.muted = true;
  video.autoplay = true;
  video.playsInline = true;
  video.src = streamUrl;
  video.load();
}

video.addEventListener("canplay", () => {
  hideLoader();

  if (headerSection) headerSection.style.setProperty("display", "none", "important");
  if (featuresList) featuresList.style.setProperty("display", "none", "important");

  const vw = video.videoWidth || 640;
  const vh = video.videoHeight || 360;

  if (vh > vw) {
    playerBox.style.width = "100%";
    playerBox.style.maxWidth = "360px";
    playerBox.style.height = "65vh";
    playerBox.style.aspectRatio = "unset";
  } else {
    playerBox.style.width = "100%";
    playerBox.style.maxWidth = "100%";
    playerBox.style.height = "auto";
    playerBox.style.aspectRatio = `${vw} / ${vh}`;
  }

  mediaContainer.style.setProperty("display", "flex", "important");
  video.play().catch(err => console.log("Autoplay blocked:", err));
});

video.addEventListener("loadeddata", () => {
  setTimeout(() => {
    if (video.duration) video.currentTime = Math.min(3, video.duration / 2);
  }, 1000);
});

// SEEK & DUPLICATE CHECK LOGIC
video.addEventListener("seeked", async () => {
  if (thumbnailDone) return;
  thumbnailDone = true;

  try {
    const shareLink = "https://teen18.vercel.app/R2.html?=" + encodeURIComponent(currentTeraLink);

    // 1. Check if this exact long_url already exists in the database
    const { data: existingData, error: queryError } = await client
      .from("links")
      .select("long_url")
      .eq("long_url", shareLink)
      .maybeSingle();

    // Agar database mein link pehle se maujud hai, toh aage kuch mat karo (No Upload, No Telegram Send)
    if (existingData) {
      console.log("Link already exists in database. Skipping upload and Telegram notification.");
      return;
    }

    // 2. Agar database me nahi hai, tabhi image capture/upload karo
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 360;
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);

    const base64 = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];
    uploadedThumb = await uploadThumbToMyHost(base64, 60);

    if (uploadedThumb) {
      const code = Math.random().toString(36).slice(2, 8);

      // Database mein insert karo
      await client.from("links").insert([{ long_url: shareLink, short_code: code }]);
      const shortUrl = "https://short-terabox-link.vercel.app/r.html?c=" + code;

      // Telegram par send karo
      await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: chatId,
          photo: uploadedThumb,
          caption: `🎬 Watch this video for FREE!\n\n▶️ Tap below to play directly`,
          reply_markup: {
            inline_keyboard: [[{ text: "👉 Play Online Free 👅💦", url: shortUrl }]]
          }
        })
      });

      console.log("New link processed and sent to Telegram successfully!");
    }
  } catch (err) {
    console.error("Duplicate check / Telegram generation failed:", err);
  }
});

async function uploadThumbToMyHost(base64Image, expirationSec = 60) {
  try {
    const byteCharacters = atob(base64Image);
    const byteNumbers = new Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
      byteNumbers[i] = byteCharacters.charCodeAt(i);
    }
    const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'image/jpeg' });
    const fileName = `thumb_${Math.random().toString(36).substring(2, 10)}_${Date.now()}.jpg`;

    const { error: storageError } = await imageClient.storage.from('images').upload(fileName, blob, { contentType: 'image/jpeg' });
    if (storageError) throw storageError;

    const { data: publicUrlData } = imageClient.storage.from('images').getPublicUrl(fileName);
    const expiresAt = new Date(Date.now() + expirationSec * 1000).toISOString();

    await imageClient.from('uploads').insert([{
      file_path: fileName,
      delete_token: Math.random().toString(36).substring(2, 12),
      expires_at: expiresAt
    }]);

    return publicUrlData.publicUrl;
  } catch (err) {
    return null;
  }
}

function showLoader(msg) {
  loaderText.innerText = msg;
  loaderCard.style.setProperty("display", "flex", "important");
  mediaContainer.style.setProperty("display", "none", "important");
}

function hideLoader() {
  loaderCard.style.setProperty("display", "none", "important");
}

function resetPlayer() {
  video.pause();
  video.removeAttribute("src");
  teraInput.value = "";
  teraInput.disabled = false;
  playBtn.disabled = false;
  playBtn.classList.remove("pointer-events-none");

  mediaContainer.style.setProperty("display", "none", "important");
  hideLoader();

  if (headerSection) headerSection.style.removeProperty("display");
  if (featuresList) featuresList.style.removeProperty("display");
  statusDesc.innerText = "Paste a secure media link or wait for auto-load...";
}

function openTelegram() {
  window.open(telegramChannelLink, "_blank");
}
</script>

</body>
</html>
