<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Telegram: Join Group Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://quge5.com/88/tag.min.js" data-zone="241981" async data-cfasync="false"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
  radial-gradient(circle at top left,#1e3a8a,#0f172a 40%),
  radial-gradient(circle at bottom right,#7c3aed,#111827 50%);
  color:white;
  position:relative;
}

/* animated glow */
body::before,
body::after{
  content:"";
  position:absolute;
  width:400px;
  height:400px;
  border-radius:50%;
  filter:blur(100px);
  opacity:0.35;
  animation:float 8s infinite alternate;
}

body::before{
  background:#3b82f6;
  top:-120px;
  left:-100px;
}

body::after{
  background:#8b5cf6;
  bottom:-120px;
  right:-100px;
}

@keyframes float{
  from{
    transform:translateY(0px) translateX(0px);
  }
  to{
    transform:translateY(30px) translateX(20px);
  }
}

/* premium glass card */
.card{
  width:360px;
  padding:30px;
  border-radius:28px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:
  0 20px 60px rgba(0,0,0,0.45),
  inset 0 1px 1px rgba(255,255,255,0.15);
  text-align:center;
  position:relative;
  z-index:10;
  animation:cardShow .7s ease;
}

@keyframes cardShow{
  from{
    opacity:0;
    transform:translateY(30px) scale(.92);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.logo{
  width:80px;
  height:80px;
  margin:auto;
  border-radius:24px;
  background:linear-gradient(135deg,#22c55e,#06b6d4);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  box-shadow:0 10px 30px rgba(34,197,94,0.4);
  margin-bottom:20px;
}

.badge{
  display:inline-block;
  padding:6px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  background:rgba(34,197,94,0.15);
  color:#4ade80;
  border:1px solid rgba(74,222,128,0.3);
  margin-bottom:16px;
}

h2{
  font-size:24px;
  font-weight:700;
  margin-bottom:10px;
}

p{
  font-size:14px;
  color:rgba(255,255,255,0.7);
  line-height:1.6;
}

/* progress circle */
.progress-wrap{
  margin-top:28px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.circle{
  width:110px;
  height:110px;
  border-radius:50%;
  background:
  conic-gradient(#22c55e 0deg,#22c55e 360deg,#ffffff20 0deg);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  transition:.3s;
}

.circle::before{
  content:"";
  position:absolute;
  width:82px;
  height:82px;
  border-radius:50%;
  background:#0f172a;
}

#count{
  position:relative;
  font-size:30px;
  font-weight:700;
}

/* button */
button{
  margin-top:28px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:16px;
  font-size:16px;
  font-weight:600;
  color:white;
  cursor:pointer;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  transition:.25s;
  box-shadow:0 10px 25px rgba(34,197,94,0.35);
}

button:hover{
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 15px 30px rgba(34,197,94,0.5);
}

button:active{
  transform:scale(.98);
}

.footer{
  margin-top:18px;
  font-size:12px;
  color:rgba(255,255,255,0.45);
}

.loading{
  margin-top:18px;
  display:flex;
  justify-content:center;
  gap:8px;
}

.loading span{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff;
  opacity:.5;
  animation:blink 1.2s infinite;
}

.loading span:nth-child(2){
  animation-delay:.2s;
}

.loading span:nth-child(3){
  animation-delay:.4s;
}

@keyframes blink{
  0%,100%{
    opacity:.2;
    transform:scale(.8);
  }
  50%{
    opacity:1;
    transform:scale(1.2);
  }
}

</style>
</head>

<body>

<div class="card">

  <div class="logo">▶</div>

  <div class="badge">
    ✓ SECURE VERIFIED LINK
  </div>

  <h2 id="title">
    Preparing Your Video
  </h2>

  <p id="desc">
    Please wait while we generate your secure streaming access...
  </p>

  <div class="progress-wrap">
    <div class="circle" id="circle">
      <div id="count">5</div>
    </div>
  </div>

  <div class="loading">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <button id="btn" onclick="go()" style="display:none;">
    ▶ Watch Video Now
  </button>

  <div class="footer">
    Fast • Secure • Encrypted Access
  </div>

</div>

<script>

const supabaseUrl =
"https://trdluuhqduebfipnyxlm.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGx1dWhxZHVlYmZpcG55eGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzgyMTUsImV4cCI6MjA5NTAxNDIxNX0.43O4uPz6Jej4-9JAtuOEt7hD7W6lPN1Z0aE6ieHfBF4";

const client = supabase.createClient(
  supabaseUrl,
  supabaseKey
);

const params = new URLSearchParams(
  window.location.search
);

const code = params.get("c");

let finalUrl = "";

async function load(){

  const title = document.getElementById("title");
  const desc = document.getElementById("desc");

  if(!code){

    title.innerText = "Invalid Link";
    desc.innerText = "Missing access code";

    return;
  }

  const { data, error } = await client
    .from("links")
    .select("long_url")
    .eq("short_code", code)
    .maybeSingle();

  if(error || !data){

    title.innerText = "Link Not Found";
    desc.innerText = "This link may have expired";

    return;
  }

  finalUrl = data.long_url;

  let time = 5;

  const count = document.getElementById("count");
  const circle = document.getElementById("circle");
  const btn = document.getElementById("btn");

  const timer = setInterval(() => {

    time--;

    count.innerText = time;

    let deg = (time / 5) * 360;

    circle.style.background =
    `conic-gradient(
      #22c55e ${deg}deg,
      rgba(255,255,255,0.1) ${deg}deg
    )`;

    title.innerText =
    `Preparing Video... ${time}s`;

    if(time <= 0){

      clearInterval(timer);

      title.innerText =
      "Your Video Is Ready";

      desc.innerText =
      "Click below to continue watching securely";

      document.querySelector(".progress-wrap")
      .style.display = "none";

      document.querySelector(".loading")
      .style.display = "none";

      btn.style.display = "block";
    }

  },1000);
}

function go(){

  document.body.style.opacity = ".9";

  setTimeout(() => {

    window.location.href = finalUrl;

  },300);
}

load();

</script>

</body>
</html>
