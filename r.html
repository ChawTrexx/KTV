<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Redirecting...</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;height:100vh;">
<p id="msg">Redirecting...</p>

<script>
const supabaseUrl = "https://trdluuhqduebfipnyxlm.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGx1dWhxZHVlYmZpcG55eGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzgyMTUsImV4cCI6MjA5NTAxNDIxNX0.43O4uPz6Jej4-9JAtuOEt7hD7W6lPN1Z0aE6ieHfBF4";

const client = supabase.createClient(supabaseUrl, supabaseKey);

// ✅ GET CODE PROPERLY
const params = new URLSearchParams(window.location.search);
const code = params.get("c");

async function go() {
  if (!code) {
    document.getElementById("msg").innerText = "Invalid Link (No Code)";
    return;
  }

  const { data, error } = await client
    .from("links")
    .select("*")
    .eq("short_code", code)
    .single();

  if (error) {
    console.log(error);
    document.getElementById("msg").innerText = "Database Error";
    return;
  }

  if (data && data.long_url) {
    document.getElementById("msg").innerText = "Redirecting...";

    setTimeout(() => {
      window.location.href = data.long_url;
    }, 800);
  } else {
    document.getElementById("msg").innerText = "Link Not Found";
  }
}

go();
</script>

</body>
</html>
