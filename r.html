<script>
// Ultra-fast Native REST API Call (No heavy external JS Supabase library required)
const supabaseUrl = "https://trdluuhqduebfipnyxlm.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGx1dWhxZHVlYmZpcG55eGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzgyMTUsImV4cCI6MjA5NTAxNDIxNX0.43O4uPz6Jej4-9JAtuOEt7hD7W6lPN1Z0aE6ieHfBF4";

let finalUrl = "";
const params = new URLSearchParams(window.location.search);
const code = params.get("c");

// Start Database Request Immediately (Instant Parallel execution)
let fetchPromise = null;

if(code){
  const targetApi = `${supabaseUrl}/rest/v1/links?short_code=eq.${encodeURIComponent(code)}&select=long_url`;
  fetchPromise = fetch(targetApi, {
    method: 'GET',
    headers: {
      'apikey': supabaseKey,
      'Authorization': `Bearer ${supabaseKey}`
    }
  })
  .then(res => res.json())
  .then(data => (data && data.length > 0) ? data[0].long_url : null)
  .catch(() => null);
}

function initCountdown(){
  const title = document.getElementById("title");
  const desc = document.getElementById("desc");
  const pWrap = document.getElementById("p-wrap");
  const loading = document.getElementById("loading");

  if(!code){
    title.innerText = "Invalid Link";
    desc.innerText = "Missing access code";
    pWrap.style.display = "none";
    loading.style.display = "none";
    return;
  }

  let time = 5;
  const count = document.getElementById("count");
  const circle = document.getElementById("circle");
  const btn = document.getElementById("btn");

  const timer = setInterval(async () => {
    time--;
    if(count) count.innerText = time;

    let deg = (time / 5) * 360;
    if(circle) circle.style.background = `conic-gradient(#22c55e ${deg}deg, rgba(255,255,255,0.1) 0deg)`;

    title.innerText = `Preparing Video... ${time}s`;

    if(time <= 0){
      clearInterval(timer);
      const urlResult = await fetchPromise;

      if(!urlResult){
        title.innerText = "Link Not Found";
        desc.innerText = "This link may have expired or is invalid";
        pWrap.style.display = "none";
        loading.style.display = "none";
        return;
      }

      finalUrl = urlResult;
      title.innerText = "Your Video Is Ready";
      desc.innerText = "Click below to continue watching securely";
      pWrap.style.display = "none";
      loading.style.display = "none";
      btn.style.display = "block";
    }
  }, 1000);
}

function go(){
  if(finalUrl) window.location.replace(finalUrl);
}

// Execute logic instantly on DOM ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initCountdown);
} else {
  initCountdown();
}
</script>
