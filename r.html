if(code){
  const targetApi = `${supabaseUrl}/rest/v1/links?short_code=eq.${encodeURIComponent(code)}&select=long_url`;

function initCountdown(){
  const title = document.getElementById("title");
  const desc = document.getElementById("desc");
  const pWrap = document.getElementById("p-wrap");
  const loading = document.getElementById("loading");

  if(!code){
    title.innerText = "Invalid Link";
    desc.innerText = "Missing access code";

  let time = 5;
  const count = document.getElementById("count");
  const circle = document.getElementById("circle");
  const btn = document.getElementById("btn");

  const timer = setInterval(async () => {
    time--;
    if(count) count.innerText = time;

    let deg = (time / 5) * 360;
    if(circle) circle.style.background = `conic-gradient(#22c55e ${deg}deg, rgba(255,255,255,0.1) 0deg)`;

    title.innerText = `Preparing Video... ${time}s`;

    if(time <= 0){
      clearInterval(timer);
      const urlResult = await fetchPromise;

}
