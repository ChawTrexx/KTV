<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Telegram: Join Group Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://quge5.com/88/tag.min.js" data-zone="241981" async data-cfasync="false"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(circle at top, #1e293b, #0f172a);
  color:white;
}

/* glass card */
.card{
  width:320px;
  padding:25px;
  border-radius:16px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(12px);
  border:1px solid rgba(255,255,255,0.1);
  text-align:center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:scale(0.9);}
  to{opacity:1; transform:scale(1);}
}

h2{
  margin-bottom:10px;
  font-size:20px;
}

p{
  font-size:14px;
  opacity:0.8;
}

button{
  margin-top:18px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background: linear-gradient(90deg,#22c55e,#16a34a);
  color:white;
  font-size:15px;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.03);
  box-shadow:0 0 15px rgba(34,197,94,0.4);
}

.badge{
  display:inline-block;
  padding:4px 10px;
  font-size:12px;
  border-radius:20px;
  background:#22c55e22;
  color:#22c55e;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="card">
  <div class="badge">✓ Verified Link</div>

  <h2 id="title">Preparing your video...</h2>

  <p id="desc">
    Please wait while we generate your secure link
  </p>

  <button id="btn" style="display:none;" onclick="go()">
    ▶ Watch Video Now
  </button>
</div>

<script>
const supabaseUrl = "https://trdluuhqduebfipnyxlm.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGx1dWhxZHVlYmZpcG55eGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzgyMTUsImV4cCI6MjA5NTAxNDIxNX0.43O4uPz6Jej4-9JAtuOEt7hD7W6lPN1Z0aE6ieHfBF4";

const client = supabase.createClient(
  supabaseUrl,
  supabaseKey
);

const params = new URLSearchParams(window.location.search);

const code = params.get("c");

let finalUrl = "";

async function load() {

  if(!code){

    document.getElementById("title").innerText =
      "Invalid Link";

    document.getElementById("desc").innerText =
      "Missing link code";

    return;
  }

  const { data, error } = await client
    .from("links")
    .select("long_url")
    .eq("short_code", code)
    .maybeSingle();

  if(error || !data){

    document.getElementById("title").innerText =
      "Link Not Found";

    document.getElementById("desc").innerText =
      "This link may have expired";

    return;
  }

  finalUrl = data.long_url;

  let time = 5;

  const title = document.getElementById("title");
  const desc = document.getElementById("desc");
  const btn = document.getElementById("btn");

  title.innerText = `Please wait ${time} seconds`;
  desc.innerText = "Your secure video is loading...";

  const countdown = setInterval(() => {

    time--;

    title.innerText = `Please wait ${time} seconds`;

    if(time <= 0){

      clearInterval(countdown);

      title.innerText = "Your video is ready";

      desc.innerText =
        "Click below to continue watching";

      btn.style.display = "block";
    }

  },1000);
}

function go(){
  window.location.href = finalUrl;
}

load();
</script>

</body>
</html>
