<script>

const imgHostAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFza3ZtdXhlZnR0Z3F2bm5hbG9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTMyNzEsImV4cCI6MjEwMTMyOTI3MX0.ImEDrU-D_M7A-wgZSAvLK8lSAj76YUza-WPdFkRaGQk";

const linkSupabaseUrl = "https://trdluuhqduebfipnyxlm.supabase.co";
const linkSupabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGx1dWhxZHVlYmZpcG55eGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzgyMTUsImV4cCI6MjA5NTAxNDIxNX0.43O4uPz6Jej4-9JAtuOEt7hD7W6lPN1Z0aE6ieHfBF4";
const linkClient = supabase.createClient(linkSupabaseUrl, linkSupabaseKey);

// ================= UTILITIES =================
function log(msg) {
  const statusLog = document.getElementById("statusLog");
  statusLog.innerHTML += `<br>> ${msg}`;
  statusLog.scrollTop = statusLog.scrollHeight;
}

async function pasteTo(inputId) {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById(inputId).value = text;
  } catch(e) {
    alert("Clipboard permission needed.");
  }
}

// ================= UPLOAD THUMBNAIL =================
async function uploadThumbToMyHost(base64Image) {
  try {
    const byteCharacters = atob(base64Image);
    const byteArray = new Uint8Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
      byteArray[i] = byteCharacters.charCodeAt(i);
    }
    const blob = new Blob([byteArray], { type: 'image/jpeg' });
    const fileName = `thumb_${Math.random().toString(36).substring(2, 8)}_${Date.now()}.jpg`;

    const { error } = await imageClient.storage.from('images').upload(fileName, blob, { contentType: 'image/jpeg' });
    if (error) throw error;

    const { data } = imageClient.storage.from('images').getPublicUrl(fileName);
    return data.publicUrl;
  } catch (err) {
    console.error(err);
    return null;
  }
}

// ================= SINGLE LINK PROCESSOR =================
async function processSingleLink(link, index) {
  if (!link) return;

  log(`[Link #${index}] Starting verification...`);

  const shareLink = "https://teen18.vercel.app/Q.html?=" + encodeURIComponent(link);

  // Check if link was already sent
  const { data: existing } = await linkClient
    .from("links")
    .select("short_code")
    .eq("long_url", shareLink)
    .maybeSingle();

  if (existing) {
    log(`[Link #${index}] ⚠️ Skipped: Already sent earlier.`);
    return;
  }

  // Stream URL
  const streamUrl = "https://1024teradownloader.in/api/video-stream?url=" +
    encodeURIComponent(link) +
    "&index=0&quality=360p";

  // Create temporary invisible video element for fast frame grab
  const v = document.createElement("video");
  v.src = streamUrl;
  v.crossOrigin = "anonymous";
  v.muted = true;
  v.playsInline = true;

  return new Promise((resolve) => {
    v.addEventListener("loadeddata", async () => {
      try {
        log(`[Link #${index}] Frame loaded, extracting thumbnail...`);
        const canvas = document.createElement("canvas");
        canvas.width = 400; // Small size for hyper-fast encoding
        canvas.height = 225;
        const ctx = canvas.getContext("2d", { alpha: false });
        ctx.drawImage(v, 0, 0, canvas.width, canvas.height);

        const base64 = canvas.toDataURL("image/jpeg", 0.5).split(",")[1];
        
        // Upload thumbnail
        const thumbUrl = await uploadThumbToMyHost(base64);
        if (!thumbUrl) {
          log(`[Link #${index}] ❌ Upload failed.`);
          resolve();
          return;
        }

        // Generate Shortcode
        const code = Math.random().toString(36).slice(2, 8);
        await linkClient.from("links").insert([{
          long_url: shareLink,
          short_code: code
        }]);

        const shortUrl = "https://short-terabox-link.vercel.app/r.html?c=" + code;

        // Post to Telegram
        await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: chatId,
            photo: thumbUrl,
            caption: `🎬 Watch video #${index} for FREE!\n\n▶️ Tap the button below to play instantly`,
            reply_markup: {
              inline_keyboard: [[{ text: "👉 Play Online Free 👅💦", url: shortUrl }]]
            }
          })
        });

        log(`[Link #${index}] ✅ Sent to Telegram successfully!`);
      } catch (err) {
        log(`[Link #${index}] ❌ Error processing video frame.`);
      } finally {
        v.remove();
        resolve();
      }
    });

    v.addEventListener("error", () => {
      log(`[Link #${index}] ❌ Stream failed to load.`);
      v.remove();
      resolve();
    });

    v.load();
  });
}

// ================= BATCH PROCESS ALL 4 LINKS =================
async function processAllFour() {
  const l1 = document.getElementById("tera1").value.trim();
  const l2 = document.getElementById("tera2").value.trim();
  const l3 = document.getElementById("tera3").value.trim();
  const l4 = document.getElementById("tera4").value.trim();

  const links = [l1, l2, l3, l4];
  
  if(!l1 && !l2 && !l3 && !l4) {
    alert("Please paste at least one link!");
    return;
  }

  document.getElementById("statusLog").innerHTML = "🚀 Starting parallel processing...";

  // Parallel processing using Promise.all for maximum speed
  const tasks = links.map((link, i) => processSingleLink(link, i + 1));
  await Promise.all(tasks);

  log("🎉 ALL TASKS COMPLETED!");
}
</script>
