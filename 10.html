<script>
// ================= CONFIGURATIONS =================
const botToken = "6634953218:AAEOaozrPHqv2Xs7uJ7L-xcStHKqee0fi1Q";
const chatId = "-1001966599723";

const imgHostUrl = "https://askvmuxefttgqvnnalod.supabase.co";
const imgHostAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFza3ZtdXhlZnR0Z3F2bm5hbG9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTMyNzEsImV4cCI6MjEwMTMyOTI3MX0.ImEDrU-D_M7A-wgZSAvLK8lSAj76YUza-WPdFkRaGQk";
const imageClient = supabase.createClient(imgHostUrl, imgHostAnonKey);

const linkSupabaseUrl = "https://trdluuhqduebfipnyxlm.supabase.co";
const linkSupabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGx1dWhxZHVlYmZpcG55eGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzgyMTUsImV4cCI6MjA5NTAxNDIxNX0.43O4uPz6Jej4-9JAtuOEt7hD7W6lPN1Z0aE6ieHfBF4";
const linkClient = supabase.createClient(linkSupabaseUrl, linkSupabaseKey);

// High-speed fallback poster if video frame extraction is blocked by browser CORS
const DEFAULT_POSTER = "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800&auto=format&fit=crop&q=80";

function log(msg) {
  const statusLog = document.getElementById("statusLog");
  statusLog.innerHTML += `<br>> ${msg}`;
  statusLog.scrollTop = statusLog.scrollHeight;
}

async function pasteTo(inputId) {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById(inputId).value = text;
  } catch(e) {
    alert("Clipboard permission needed.");
  }
}

// ================= UPLOAD THUMBNAIL =================
async function uploadThumbToMyHost(base64Image) {
  try {
    const byteCharacters = atob(base64Image);
    const byteArray = new Uint8Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
      byteArray[i] = byteCharacters.charCodeAt(i);
    }
    const blob = new Blob([byteArray], { type: 'image/jpeg' });
    const fileName = `thumb_${Math.random().toString(36).substring(2, 8)}_${Date.now()}.jpg`;

    const { error } = await imageClient.storage.from('images').upload(fileName, blob, { contentType: 'image/jpeg' });
    if (error) throw error;

    const { data } = imageClient.storage.from('images').getPublicUrl(fileName);
    return data.publicUrl;
  } catch (err) {
    console.error("Upload Error:", err);
    return null;
  }
}

// ================= SINGLE LINK PROCESSOR =================
async function processSingleLink(link, index) {
  if (!link) return;

  log(`[Link #${index}] Verifying database...`);
  const shareLink = "https://teen18.vercel.app/Q.html?=" + encodeURIComponent(link);

  // 1. Check duplicate
  const { data: existing } = await linkClient
    .from("links")
    .select("short_code")
    .eq("long_url", shareLink)
    .maybeSingle();

  if (existing) {
    log(`[Link #${index}] ⚠️ Skipped: Link already posted!`);
    return;
  }

  // 2. Short Code Create
  const code = Math.random().toString(36).slice(2, 8);
  await linkClient.from("links").insert([{
    long_url: shareLink,
    short_code: code
  }]);
  const shortUrl = "https://short-terabox-link.vercel.app/r.html?c=" + code;

  log(`[Link #${index}] Creating preview thumbnail...`);

  // Stream URL
  const streamUrl = "https://1024teradownloader.in/api/video-stream?url=" +
    encodeURIComponent(link) +
    "&index=0&quality=360p";

  let finalPhotoUrl = DEFAULT_POSTER;

  // Try extracting frame fast
  try {
    const v = document.createElement("video");
    v.src = streamUrl;
    v.crossOrigin = "anonymous";
    v.muted = true;
    v.playsInline = true;

    await new Promise((res) => {
      const timeout = setTimeout(() => res(), 3000); // 3-second hard limit to prevent stalling
      
      v.onloadeddata = async () => {
        clearTimeout(timeout);
        try {
          const canvas = document.createElement("canvas");
          canvas.width = 480;
          canvas.height = 270;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
          const base64 = canvas.toDataURL("image/jpeg", 0.6).split(",")[1];
          const uploaded = await uploadThumbToMyHost(base64);
          if (uploaded) finalPhotoUrl = uploaded;
        } catch(e) {
          log(`[Link #${index}] CORS Canvas restricted. Switching to fast poster.`);
        }
        res();
      };
      
      v.onerror = () => {
        clearTimeout(timeout);
        res();
      };
      
      v.load();
    });
  } catch(e) {
    console.log(e);
  }

  // 3. Telegram Send (Guaranteed Delivery)
  log(`[Link #${index}] Sending to Telegram...`);
  const res = await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chat_id: chatId,
      photo: finalPhotoUrl,
      caption: `🎬 Watch video #${index} for FREE!\n\n▶️ Tap the button below to play instantly`,
      reply_markup: {
        inline_keyboard: [[{ text: "👉 Play Online Free 👅💦", url: shortUrl }]]
      }
    })
  });

  const tgResult = await res.json();
  if (tgResult.ok) {
    log(`[Link #${index}] ✅ Successfully posted to Telegram!`);
  } else {
    log(`[Link #${index}] ❌ Telegram Error: ${tgResult.description}`);
  }
}

// ================= BATCH PROCESS ALL 4 LINKS =================
async function processAllFour() {
  const l1 = document.getElementById("tera1").value.trim();
  const l2 = document.getElementById("tera2").value.trim();
  const l3 = document.getElementById("tera3").value.trim();
  const l4 = document.getElementById("tera4").value.trim();

  const links = [l1, l2, l3, l4];
  
  if(!l1 && !l2 && !l3 && !l4) {
    alert("Please paste at least one link!");
    return;
  }

  document.getElementById("statusLog").innerHTML = "🚀 Starting auto-broadcast engine...";

  for (let i = 0; i < links.length; i++) {
    if (links[i]) {
      await processSingleLink(links[i], i + 1);
    }
  }

  log("🎉 PROCESS COMPLETED!");
}
</script>
