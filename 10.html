<script>
// ================= CONFIG & API KEYS =================
const imgbbApi = "5aacb3e6f7364ee6196c4e831dfc8f3d";
const botToken = "6634953218:AAEOaozrPHqv2Xs7uJ7L-xcStHKqee0fi1Q";
const chatId = "-1001966599723";

const supabaseUrl = "https://trdluuhqduebfipnyxlm.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGx1dWhxZHVlYmZpcG55eGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzgyMTUsImV4cCI6MjA5NTAxNDIxNX0.43O4uPz6Jej4-9JAtuOEt7hD7W6lPN1Z0aE6ieHfBF4";
const client = supabase.createClient(supabaseUrl, supabaseKey);

// 10 Video Elements & States
const videoElements = Array.from({ length: 10 }, (_, i) => document.getElementById(`player${i}`));
const videoStates = Array.from({ length: 10 }, () => ({ link: "", thumbnailDone: false }));

// Queue for Processing Videos Sequentially
let processQueue = [];
let isProcessing = false;

// ================= MAIN FUNCTION: PLAY ALL =================
function playAllVideos() {
  processQueue = [];
  
  for (let i = 0; i < 10; i++) {
    const inputEl = document.getElementById(`teraInput${i}`);
    const link = inputEl ? inputEl.value.trim() : "";

    if (link) {
      videoStates[i].link = link;
      videoStates[i].thumbnailDone = false;

      const streamUrl = "https://1024teradownloader.in/api/video-stream?url=" +
        encodeURIComponent(link) +
        "&index=0&quality=360p";

      const vEl = videoElements[i];
      vEl.src = streamUrl;
      vEl.load();
      vEl.play().catch(e => console.log(`Auto-play blocked for player ${i + 1}`, e));
    }
  }
}

// Attach Event Listeners to Seek & Push to Queue
videoElements.forEach((video, index) => {

  video.addEventListener("loadeddata", () => {
    setTimeout(() => {
      video.currentTime = Math.min(3, video.duration || 1);
    }, 1500);
  });

  video.addEventListener("seeked", () => {
    const state = videoStates[index];
    if (state.thumbnailDone || !state.link) return;

    state.thumbnailDone = true;
    
    // Push task to queue
    processQueue.push({ video, index, link: state.link });
    processQueueNext();
  });
});

// Sequential Worker (One by One Upload & Telegram Dispatch)
async function processQueueNext() {
  if (isProcessing || processQueue.length === 0) return;

  isProcessing = true;
  const task = processQueue.shift();

  const btnText = document.getElementById("btnText");
  btnText.innerText = `PROCESSING ${task.index + 1}/10...`;

  try {
    const video = task.video;
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const base64 = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];

    // Upload to ImgBB
    const upload = await fetch("https://api.imgbb.com/1/upload?key=" + imgbbApi, {
      method: "POST",
      body: new URLSearchParams({
        image: base64,
        expiration: "60"
      })
    });

    const data = await upload.json();

    if (data.success) {
      const uploadedThumb = data.data.url;
      const code = Math.random().toString(36).slice(2, 8);
      const shareLink = "https://teen18.vercel.app/Q.html?=" + encodeURIComponent(task.link);

      // Check Duplicates
      const existing = await client
        .from("links")
        .select("*")
        .eq("long_url", shareLink)
        .maybeSingle();

      if (!existing.data) {
        await client.from("links").insert([{ long_url: shareLink, short_code: code }]);
        const shortUrl = "https://short-terabox-link.vercel.app/r.html?c=" + code;

        // Send Photo to Telegram
        await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: chatId,
            photo: uploadedThumb,
            caption: `🎬 Watch this video for FREE!\n\n▶️ Tap the button below to play instantly`,
            reply_markup: {
              inline_keyboard: [[{ text: "👉 Play Online Free 👅💦", url: shortUrl }]]
            }
          })
        });
      }
    }
  } catch (err) {
    console.error(`Error processing video ${task.index + 1}:`, err);
  }

  isProcessing = false;

  if (processQueue.length > 0) {
    processQueueNext();
  } else {
    btnText.innerText = "ALL DONE! ▶️ PLAY AGAIN";
    setTimeout(() => {
      btnText.innerText = "PLAY ALL VIDEOS";
    }, 4000);
  }
}
</script>
