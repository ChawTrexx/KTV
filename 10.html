const supabaseUrl = "https://trdluuhqduebfipnyxlm.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGx1dWhxZHVlYmZpcG55eGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzgyMTUsImV4cCI6MjEwMTMyOTI3MX0.43O4uPz6Jej4-9JAtuOEt7hD7W6lPN1Z0aE6ieHfBF4";
const client = supabase.createClient(supabaseUrl, supabaseKey);

const videoElements = Array.from({ length: 10 }, (_, i) => document.getElementById(`player${i}`));
const videoStates = Array.from({ length: 10 }, () => ({ link: "", thumbnailDone: false }));

let processQueue = [];
let isProcessing = false;

function showStatus(msg, isSuccess = false) {
  const banner = document.getElementById("statusBanner");
  const text = document.getElementById("statusText");
  banner.classList.remove("hidden");
  text.innerText = msg;
  if(isSuccess) {

  } else {
    text.className = "text-pink-400 font-semibold";
  }
}

async function uploadThumbToMyHost(base64Image, expirationSec = 60) {
  try {
    const byteCharacters = atob(base64Image);
    const byteNumbers = new Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
      byteNumbers[i] = byteCharacters.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: 'image/jpeg' });

    const fileName = `thumb_${Math.random().toString(36).substring(2, 10)}_${Date.now()}.jpg`;

    const { data: storageData, error: storageError } = await imageClient
      .storage
      .from('images')
      .upload(fileName, blob, { contentType: 'image/jpeg' });

    if (storageError) throw storageError;

    const { data: publicUrlData } = imageClient
      .storage
      .from('images')
      .getPublicUrl(fileName);

    const publicUrl = publicUrlData.publicUrl;
    const expiresAt = new Date(Date.now() + expirationSec * 1000).toISOString();

    await imageClient.from('uploads').insert([{
      file_path: fileName,
      delete_token: Math.random().toString(36).substring(2, 12),
      expires_at: expiresAt
    }]);

    return publicUrl;
  } catch (err) {
    console.error("Custom Image Host Error:", err);
    return null;
  }
}

function playAllVideos() {
  processQueue = [];
  let countInputs = 0;
  
  for (let i = 0; i < 10; i++) {
    const inputEl = document.getElementById(`teraInput${i}`);
    const link = inputEl ? inputEl.value.trim() : "";

    if (link) {
      countInputs++;
      videoStates[i].link = link;
      videoStates[i].thumbnailDone = false;

      const streamUrl = "https://1024teradownloader.in/api/video-stream?url=" +
        encodeURIComponent(link) +
        "&index=0&quality=360p";

      const vEl = videoElements[i];
      vEl.src = streamUrl;
      vEl.load();
      vEl.play().catch(e => console.log(`Auto-capture started for video ${i + 1}`));
    }
  }

  if(countInputs === 0) {
    showStatus("⚠️ Please enter at least one link!");
    setTimeout(() => document.getElementById("statusBanner").classList.add("hidden"), 3000);
  } else {
    showStatus(`Processing ${countInputs} links in background... ⏳`);
  }
}

videoElements.forEach((video, index) => {
  video.addEventListener("loadeddata", () => {
    setTimeout(() => {
      video.currentTime = Math.min(3, video.duration || 1);
    }, 1200);
  });

  video.addEventListener("seeked", () => {
    const state = videoStates[index];
    if (state.thumbnailDone || !state.link) return;

    state.thumbnailDone = true;
    processQueue.push({ video, index, link: state.link });
    processQueueNext();
  });
});

async function processQueueNext() {
  if (isProcessing || processQueue.length === 0) return;

  isProcessing = true;
  const task = processQueue.shift();

  const btnText = document.getElementById("btnText");
  const progressMsg = `🚀 Processing Link ${task.index + 1}...`;
  btnText.innerText = progressMsg;
  showStatus(progressMsg);

  try {
    const video = task.video;
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const base64 = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];

    const uploadedThumb = await uploadThumbToMyHost(base64, 60);

    if (uploadedThumb) {
      const code = Math.random().toString(36).slice(2, 8);
      const shareLink = "https://teen18.vercel.app/Q.html?=" + encodeURIComponent(task.link);

      const existing = await client
        .from("links")
        .select("*")
        .eq("long_url", shareLink)
        .maybeSingle();

      if (!existing.data) {
        await client.from("links").insert([{ long_url: shareLink, short_code: code }]);
        const shortUrl = "https://short-terabox-link.vercel.app/r.html?c=" + code;

        await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: chatId,
            photo: uploadedThumb,
            caption: `🎬 Watch this video for FREE!\n\n▶️ Tap the button below to play instantly`,
            reply_markup: {
              inline_keyboard: [[{ text: "👉 Play Online Free 👅💦", url: shortUrl }]]
            }
          })
        });
      }
    }
  } catch (err) {
    console.error(`Error processing video ${task.index + 1}:`, err);
  }

  isProcessing = false;

  if (processQueue.length > 0) {
    processQueueNext();
  } else {
    btnText.innerText = "ALL SENT TO TELEGRAM! ✅";
    showStatus("🎉 All Uploaded & Posted Successfully! ✅", true);
    setTimeout(() => {
      btnText.innerText = "GENERATE & POST TO TELEGRAM";
      document.getElementById("statusBanner").classList.add("hidden");
    }, 5000);
  }
}
</script>
