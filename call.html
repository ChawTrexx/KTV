<!DOCTYPE html>
<html>
<head>
<title>🔥 Auto Voice Call</title>
<style>
body{background:#0a0f1e;color:#fff;text-align:center;font-family:sans-serif}
button{padding:10px 20px;margin:10px;border:none;border-radius:8px;background:#3b82f6;color:#fff}
#incoming{display:none;background:#111;padding:20px;border-radius:10px}
</style>
</head>

<body>

<h2>📞 Auto Calling System</h2>

<button id="callBtn">📞 Call</button>

<div id="incoming">
  <h3>📞 Incoming Call</h3>
  <button id="accept">✅ Accept</button>
  <button id="reject">❌ Reject</button>
</div>

<audio id="remoteAudio" autoplay></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, set, onValue, push, remove, get, child } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const app = initializeApp({
 apiKey: "AIzaSyC8mmwZ_H-jTPNfZsTXIymIuD_wHN0KaXk",
 databaseURL: "https://wechat-34e85-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db = getDatabase(app);

const callBtn = document.getElementById("callBtn");
const incomingDiv = document.getElementById("incoming");
const acceptBtn = document.getElementById("accept");
const rejectBtn = document.getElementById("reject");
const remoteAudio = document.getElementById("remoteAudio");

let pc, localStream;
let roomId = null;
let uid = Math.random().toString(36).slice(2);
let isBusy = false;

const servers = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

// 🔧 Create Peer
async function createPC(){
  pc = new RTCPeerConnection(servers);

  localStream = await navigator.mediaDevices.getUserMedia({ audio:true });

  localStream.getTracks().forEach(t=>pc.addTrack(t, localStream));

  pc.ontrack = e=>{
    remoteAudio.srcObject = e.streams[0];
  };

  pc.onicecandidate = e=>{
    if(e.candidate){
      push(ref(db, `calls/${roomId}/ice/${uid}`), e.candidate.toJSON());
    }
  };
}

// 📞 Start Call
callBtn.onclick = async ()=>{
  if(isBusy) return alert("Already in call");

  roomId = "room_" + Date.now();
  isBusy = true;

  await createPC();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await set(ref(db, `calls/${roomId}`), {
    offer,
    from: uid,
    status: "calling"
  });

  listenAnswer();
  listenICE();
};

// 👂 Listen for incoming (FIXED: no spam)
onValue(ref(db, "calls"), snap=>{
  const calls = snap.val();
  if(!calls || isBusy) return;

  for(const id in calls){
    const call = calls[id];

    if(call.from !== uid && call.status === "calling"){
      roomId = id;
      isBusy = true;
      incomingDiv.style.display = "block";
      break;
    }
  }
});

// ✅ Accept
acceptBtn.onclick = async ()=>{
  incomingDiv.style.display = "none";

  await createPC();

  const snap = await get(ref(db, `calls/${roomId}`));
  const data = snap.val();

  await pc.setRemoteDescription(data.offer);

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await set(ref(db, `calls/${roomId}/answer`), answer);
  await set(ref(db, `calls/${roomId}/status`), "connected");

  listenICE();
};

// ❌ Reject
rejectBtn.onclick = async ()=>{
  incomingDiv.style.display = "none";
  await remove(ref(db, `calls/${roomId}`));
  isBusy = false;
};

// 📥 Answer listener
function listenAnswer(){
  onValue(ref(db, `calls/${roomId}/answer`), async snap=>{
    const ans = snap.val();
    if(ans && !pc.currentRemoteDescription){
      await pc.setRemoteDescription(ans);
    }
  });
}

// ❄️ ICE
function listenICE(){
  onValue(ref(db, `calls/${roomId}/ice`), snap=>{
    const data = snap.val();
    if(!data || !pc) return;

    Object.entries(data).forEach(([id, list])=>{
      if(id !== uid){
        Object.values(list).forEach(c=>{
          pc.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});
        });
      }
    });
  });
}

</script>

</body>
</html>
