<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Voice Call Pro</title>

<style>
body{
  margin:0;
  background:#0a0f1e;
  color:#fff;
  font-family:Poppins;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#11182e;
  padding:20px;
  border-radius:15px;
  width:320px;
  text-align:center;
  box-shadow:0 0 20px #00f0ff33;
}
input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
  background:#1b2445;
  color:#fff;
}
button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
.call{background:#00c853;}
.end{background:#ff1744;}
.accept{background:#00e676;}
.reject{background:#ff5252;}

#incoming{
  display:none;
  background:#1a237e;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="box">
  <h2>📞 Voice Call</h2>

  <input id="userId" readonly>
  <input id="callTo" placeholder="Enter User ID">

  <button class="call" onclick="startCall()">Call</button>
  <button class="end" onclick="endCall()">End</button>

  <div id="incoming">
    <p>📲 Incoming Call...</p>
    <button class="accept" onclick="acceptCall()">Accept</button>
    <button class="reject" onclick="rejectCall()">Reject</button>
  </div>

  <audio id="remoteAudio" autoplay></audio>
</div>

<audio id="ringtone" src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_rings.ogg" loop></audio>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, set, onValue, push, onChildAdded, remove } 
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

// 🔥 Firebase config (tumhara same)
const firebaseConfig = {
  apiKey: "AIzaSyC8mmwZ_H-jTPNfZsTXIymIuD_wHN0KaXk",
  authDomain: "wechat-34e85.firebaseapp.com",
  databaseURL: "https://wechat-34e85-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "wechat-34e85",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 👤 Auto user ID
const userId = "user_" + Math.floor(Math.random()*10000);
document.getElementById("userId").value = userId;

let pc = new RTCPeerConnection({
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
});

let localStream;
let currentCall = null;

// 🎤 mic access
navigator.mediaDevices.getUserMedia({ audio:true }).then(stream=>{
  localStream = stream;
  stream.getTracks().forEach(track=>pc.addTrack(track, stream));
});

// 🔊 remote audio
pc.ontrack = e=>{
  document.getElementById("remoteAudio").srcObject = e.streams[0];
};

// 🧊 ICE send
pc.onicecandidate = e=>{
  if(e.candidate && currentCall){
    const refPath = "calls/"+currentCall+"/ice";
    set(push(ref(db, refPath)), JSON.stringify(e.candidate));
  }
};

// 🧊 ICE receive
function listenICE(other){
  onChildAdded(ref(db, "calls/"+other+"/ice"), snap=>{
    const candidate = new RTCIceCandidate(JSON.parse(snap.val()));
    pc.addIceCandidate(candidate);
  });
}

// 📞 CALL
window.startCall = async ()=>{
  const to = document.getElementById("callTo").value;
  currentCall = to;

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  set(ref(db, "calls/"+to+"/offer"), JSON.stringify(offer));
  listenAnswer(to);
  listenICE(to);
};

// 📲 Incoming detect
onValue(ref(db, "calls/"+userId+"/offer"), snap=>{
  if(snap.exists()){
    document.getElementById("incoming").style.display="block";
    document.getElementById("ringtone").play();
  }
});

// ✅ Accept
window.acceptCall = async ()=>{
  document.getElementById("incoming").style.display="none";
  document.getElementById("ringtone").pause();

  const snap = await new Promise(res=>{
    onValue(ref(db, "calls/"+userId+"/offer"), s=>res(s), {onlyOnce:true});
  });

  const offer = JSON.parse(snap.val());
  await pc.setRemoteDescription(offer);

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  set(ref(db, "calls/"+userId+"/answer"), JSON.stringify(answer));

  listenICE(userId);
};

// ❌ Reject
window.rejectCall = ()=>{
  document.getElementById("incoming").style.display="none";
  document.getElementById("ringtone").pause();
};

// 🔁 Listen answer
function listenAnswer(to){
  onValue(ref(db, "calls/"+to+"/answer"), async snap=>{
    if(!snap.exists()) return;
    const ans = JSON.parse(snap.val());
    await pc.setRemoteDescription(ans);
  });
}

// ❌ End call
window.endCall = ()=>{
  pc.close();
  remove(ref(db, "calls/"+userId));
  alert("Call Ended");
};

</script>
</body>
</html>
