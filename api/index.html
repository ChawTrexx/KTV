<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeraPlayer Preview Test</title>
</head>

<body>

    <button onclick="getPreview()">Get Preview</button>

    <pre id="result">Waiting...</pre>

    <script>

        async function getPreview() {

            const apiUrl =
                "https://teraplayer-xfwi.onrender.com/api/preview";

            const requestData = {
                url: "https://terasharelink.com/s/1uVnhRRvA3MH1cNKAPa8urQ",
                password: ""
            };

            const result =
                document.getElementById("result");

            result.textContent = "Loading...";

            try {

                const response = await fetch(apiUrl, {
                    method: "POST",

                    headers: {
                        "Accept": "application/json, text/plain, */*",
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(requestData)
                });

                const text = await response.text();

                console.log("Status:", response.status);
                console.log("Response:", text);

                result.textContent =
                    "HTTP Status: " +
                    response.status +
                    "\n\n" +
                    text;

            } catch (error) {

                console.error(error);

                result.textContent =
                    "ERROR:\n\n" +
                    error.message +
                    "\n\n" +
                    "Browser CORS ki wajah se API request block kar sakta hai.";

            }
        }

    </script>

</body>
</html>
