<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeraBox Stream Player</title>
  <!-- HLS.js Library for M3U8 Video Playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121212; color: #fff; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 15px; }
    input, button { padding: 12px; border-radius: 6px; border: none; font-size: 16px; }
    input { background: #222; color: #fff; border: 1px solid #444; width: 100%; }
    button { background: #ff0055; color: #fff; cursor: pointer; font-weight: bold; }
    button:hover { background: #d00044; }
    .player-box { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 8px; overflow: hidden; }
    video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #status { font-size: 14px; color: #aaa; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <h2>TeraBox Video Player</h2>
  
  <input type="text" id="teraboxUrl" placeholder="Paste TeraBox Link Here..." />
  <button onclick="playVideo()">Play Video</button>
  
  <div id="status"></div>

  <div class="player-box">
    <video id="videoPlayer" controls></video>
  </div>
</div>

<script>
async function playVideo() {
  const urlInput = document.getElementById('teraboxUrl').value.trim();
  const status = document.getElementById('status');
  const video = document.getElementById('videoPlayer');

  if (!urlInput) {
    status.innerText = "Please paste a valid TeraBox link.";
    return;
  }

  status.innerText = "Fetching stream link...";

  try {
    // API request to fetch direct stream URL
    const response = await fetch('https://playtera.in/api/auto', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        url: urlInput,
        reset: true
      })
    });

    const data = await response.json();

    // Check if stream URL exists in response
    const streamUrl = data?.url || data?.stream_url || data?.fast_stream;

    if (streamUrl) {
      status.innerText = "Playing Video...";
      
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Native HLS support for Safari/iOS
        video.src = streamUrl;
        video.play();
      }
    } else {
      status.innerText = "Failed to extract stream link. Try another URL.";
    }
  } catch (error) {
    console.error(error);
    status.innerText = "Error connecting to the streaming backend (CORS or API issue).";
  }
}
</script>

</body>
</html>
